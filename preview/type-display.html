<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-sans); }
  .stack > * + * { margin-top: 10px; }
  .hero { font-family: var(--font-display); font-size: 72px; line-height:.9; letter-spacing:-.02em; text-transform:uppercase; color: var(--we-ink); }
  .hero .neon { background: var(--we-grad-neon); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .meta { font-family: var(--font-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color: var(--fg-3); }
</style></head>
<body>
  <div class="stack">
    <div class="meta">Archivo Black · 72 / 0.9 / –0.02em</div>
    <div class="hero">GO <span class="neon">VIRAL.</span><br>SELL MORE.</div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Stat Callouts</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--we-ink); font-family: var(--font-sans); color:#fff; }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; }
  .stat { border-left: 3px solid var(--we-magenta); padding-left: 14px; }
  .num { font-family: var(--font-display); font-size: 36px; line-height: 1; letter-spacing: -.02em; }
  .num .unit { color: var(--we-magenta); }
  .label { font-family: var(--font-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color: #a0a0a0; margin-top: 8px; }
</style></head>
<body>
  <div class="row">
    <div class="stat"><div class="num">$150<span class="unit">M+</span></div><div class="label">GMV generated</div></div>
    <div class="stat"><div class="num">200<span class="unit">+</span></div><div class="label">Brand partners</div></div>
    <div class="stat"><div class="num">50<span class="unit">K</span></div><div class="label">Creator network</div></div>
    <div class="stat"><div class="num">#1</div><div class="label">TSP ROAS · Q2</div></div>
  </div>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding: 20px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; border-radius: 10px; aspect-ratio: 1.2 / 1; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; color:#fff; font-size:11px; font-family: var(--font-mono); box-shadow: var(--shadow-sm); }
  .sw .name { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 10px; opacity:.95; }
  .sw .hex { opacity: .85; }
  .dark { color: #0D0D0D; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#FF5BF8"><span class="name">Magenta</span><span class="hex">#FF5BF8</span></div>
    <div class="sw" style="background:#FF80F9"><span class="name">Magenta Soft</span><span class="hex">#FF80F9</span></div>
    <div class="sw" style="background:#FF2DF0"><span class="name">Magenta Hot</span><span class="hex">#FF2DF0</span></div>
    <div class="sw" style="background:#A130CF"><span class="name">Violet</span><span class="hex">#A130CF</span></div>
    <div class="sw" style="background:#6B14A3"><span class="name">Violet Deep</span><span class="hex">#6B14A3</span></div>
    <div class="sw" style="background:#2A0A45"><span class="name">Violet Ink</span><span class="hex">#2A0A45</span></div>
  </div>
</body></html>

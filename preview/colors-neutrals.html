<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding:20px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; border-radius:10px; aspect-ratio:1.2/1; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; font-size:11px; font-family: var(--font-mono); box-shadow: var(--shadow-sm); }
  .sw .name { font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:10px; }
  .sw.light { border:1px solid var(--we-line); color: var(--we-ink); }
  .sw.dark { color:#fff; }
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:#0D0D0D"><span class="name">Ink</span><span>#0D0D0D</span></div>
    <div class="sw dark" style="background:#2A2A2A"><span class="name">Ink 2</span><span>#2A2A2A</span></div>
    <div class="sw dark" style="background:#5C5C5C"><span class="name">Ink 3</span><span>#5C5C5C</span></div>
    <div class="sw light" style="background:#E5E5E5"><span class="name">Line</span><span>#E5E5E5</span></div>
    <div class="sw light" style="background:#F2F2F2"><span class="name">Surface 2</span><span>#F2F2F2</span></div>
    <div class="sw light" style="background:#FAFAFA"><span class="name">Surface</span><span>#FAFAFA</span></div>
    <div class="sw light" style="background:#FFFFFF"><span class="name">White</span><span>#FFFFFF</span></div>
  </div>
</body></html>

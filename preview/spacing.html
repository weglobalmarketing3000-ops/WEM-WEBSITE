<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-sans); }
  .row { display:flex; align-items:center; gap:16px; margin-bottom: 8px; }
  .label { font-family: var(--font-mono); font-size:11px; color: var(--fg-3); width:80px; }
  .px { font-family: var(--font-mono); font-size:11px; color: var(--fg-2); width:50px; text-align:right; }
  .bar { height: 14px; background: var(--we-grad-neon); border-radius:3px; }
</style></head>
<body>
  <div class="row"><span class="label">--s-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="label">--s-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="label">--s-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="label">--s-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="label">--s-5</span><span class="px">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="label">--s-6</span><span class="px">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="label">--s-7</span><span class="px">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="label">--s-8</span><span class="px">64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="label">--s-9</span><span class="px">96px</span><div class="bar" style="width:96px"></div></div>
</body></html>

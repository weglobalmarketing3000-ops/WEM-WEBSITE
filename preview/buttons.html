<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#fff; font-family: var(--font-sans); display:flex; flex-direction: column; gap:16px; }
  .row { display:flex; gap:12px; align-items:center; }
  .meta { font-family: var(--font-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color: var(--fg-3); width:80px; }
</style></head>
<body>
  <div class="row"><span class="meta">Primary</span>
    <button class="we-btn we-btn-primary">Book a call →</button>
    <button class="we-btn we-btn-primary" style="padding:14px 28px; font-size:16px">Start selling →</button>
  </div>
  <div class="row"><span class="meta">Dark</span>
    <button class="we-btn we-btn-dark">Our work</button>
    <button class="we-btn we-btn-dark">See case studies</button>
  </div>
  <div class="row"><span class="meta">Ghost</span>
    <button class="we-btn we-btn-ghost">Learn more</button>
    <button class="we-btn we-btn-ghost">联系我们</button>
  </div>
</body></html>

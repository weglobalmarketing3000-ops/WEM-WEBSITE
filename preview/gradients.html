<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Signature Gradients</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding:20px; }
  .row { display:flex; gap:10px; }
  .g { flex:1; border-radius:14px; aspect-ratio:1.5/1; display:flex; flex-direction:column; justify-content:space-between; padding:12px; color:#fff; font-family: var(--font-mono); font-size:10px; }
  .g .name { font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:10px; }
  .g .css { opacity:.8; font-size:9px; }
  .g1 { background: linear-gradient(135deg,#FF5BF8 0%,#A130CF 100%); }
  .g2 { background: linear-gradient(135deg,#FF80F9 0%,#B84FDC 100%); }
  .g3 { background: linear-gradient(180deg,#A130CF 0%,#6B14A3 100%); }
  .g4 { background: linear-gradient(180deg,#2A0A45 0%,#0D0D0D 100%); }
</style></head>
<body>
  <div class="row">
    <div class="g g1"><span class="name">Neon</span><span class="css">135° · Magenta → Violet</span></div>
    <div class="g g2"><span class="name">Neon Soft</span><span class="css">135° · Pink → Orchid</span></div>
    <div class="g g3"><span class="name">Violet</span><span class="css">180° · Violet → Deep</span></div>
    <div class="g g4"><span class="name">Ink</span><span class="css">180° · Ink → Black</span></div>
  </div>
</body></html>

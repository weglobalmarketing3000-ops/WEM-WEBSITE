<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="78" font-family="Arial" font-size="38" font-weight="800" fill="#18275e">SIX FRAMES, NOT SIX RANDOM ANGLES</text><rect x="70" y="118" width="1160" height="71" rx="20" fill="#fff"/><circle cx="125" cy="153.5" r="29" fill="#7187e9"/><text x="107" y="161.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">01</text><text x="178" y="149" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">IDENTITY</text><text x="440" y="149" font-family="Arial" font-size="20" fill="#303957">Return label, order or tracking reference</text><rect x="70" y="201" width="1160" height="71" rx="20" fill="#e9e5ff"/><circle cx="125" cy="236.5" r="29" fill="#7187e9"/><text x="107" y="244.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">02</text><text x="178" y="232" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">PARCEL</text><text x="440" y="232" font-family="Arial" font-size="20" fill="#303957">Six sides, seal and transit damage</text><rect x="70" y="284" width="1160" height="71" rx="20" fill="#fff"/><circle cx="125" cy="319.5" r="29" fill="#7187e9"/><text x="107" y="327.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">03</text><text x="178" y="315" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">CONTENTS</text><text x="440" y="315" font-family="Arial" font-size="20" fill="#303957">Item, parts, gifts and packaging</text><rect x="70" y="367" width="1160" height="71" rx="20" fill="#e9e5ff"/><circle cx="125" cy="402.5" r="29" fill="#7187e9"/><text x="107" y="410.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">04</text><text x="178" y="398" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">WHOLE ITEM</text><text x="440" y="398" font-family="Arial" font-size="20" fill="#303957">Full view and present condition</text><rect x="70" 
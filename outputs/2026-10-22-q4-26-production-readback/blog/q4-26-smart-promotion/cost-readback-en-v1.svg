<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC" font-size="40" font-weight="800" fill="#171717">Three numbers, three different questions</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g transform="translate(64 160)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#6f5bd4"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">ORDER DISCOUNT</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">What did the buyer receive?</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">A consumer benefit, not the seller actual cost</text></g><g transform="translate(64 300)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#245bd7"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">SETTLEMENT FEE</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">What did the seller pay?</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Read the fee line in Settlement Details or Report</text></g><g transform="translate(64 440)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#ed168c"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">CONTRIBUTION</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">Was the increment worth it?</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Incremental revenue less product, fulfillment, returns and promotion</text></g></svg>
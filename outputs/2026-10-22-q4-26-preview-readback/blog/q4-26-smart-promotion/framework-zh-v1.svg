<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" rx="34" fill="#fff"/><text x="64" y="84" font-family="Arial,PingFang SC" font-size="40" font-weight="800" fill="#171717">判断增长的四步复核</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#ed168c"/><g><rect x="64" y="160" width="610" height="195" rx="24" fill="#f1eeff" stroke="#d8d1ef"/><circle cx="119" cy="214" r="28" fill="#245bd7"/><text x="162" y="222" font-family="Arial,PingFang SC" font-size="24" font-weight="800" fill="#171717">01 基线</text><foreignObject x="98" y="258" width="540" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.45;color:#514b57">先记录未参加时的订单、GMV、退款与原有流量成本。</div></foreignObject></g><g><rect x="714" y="160" width="610" height="195" rx="24" fill="#fbf9ff" stroke="#d8d1ef"/><circle cx="769" cy="214" r="28" fill="#ed168c"/><text x="812" y="222" font-family="Arial,PingFang SC" font-size="24" font-weight="800" fill="#171717">02 重叠</text><foreignObject x="748" y="258" width="540" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.45;color:#514b57">把 Smart Promotion、达人与广告的归因标记当作不同视角，不直接相加。</div></foreignObject></g><g><rect x="64" y="395" width="610" height="195" rx="24" fill="#f1eeff" stroke="#d8d1ef"/><circle cx="119" cy="449" r="28" fill="#245bd7"/><text x="162" y="457" font-family="Arial,PingFang SC" font-size="24" font-weight="800" fill="#171717">03 结算</text><foreignObject x="98" y="493" width="540" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.45;color:#514b57">订单页优惠是消费者权益，实际卖家成本以结算明细为准。</div></foreignObject></g><g><rect x="714" y="395" width="610" height="195" rx="24" fill="#fbf9ff" stroke="#d8d1ef"/><circle cx="769" cy="449" r="28" fill="#ed168c"/><text x="812" y="457" font-family="Arial,PingFang SC" font-size="24" font-weight="800" fill="#171717">04 贡献</text><foreignObject x="748" y="493" width="540" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.45;color:#514b57">从增量毛利中扣除商品、履约、退货与推广成本，再决定是否扩量。</div></foreignObject></g><text x="1336" y="665" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#1746b8">WE MARKETING</text></svg>
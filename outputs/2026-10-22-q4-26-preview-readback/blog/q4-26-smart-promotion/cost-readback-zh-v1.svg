<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC" font-size="40" font-weight="800" fill="#171717">三个数字，三个不同问题</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g transform="translate(64 160)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#6f5bd4"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">订单页优惠</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">买家得到了什么？</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">消费者权益，不等同于卖家实际成本</text></g><g transform="translate(64 300)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#245bd7"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">结算费用</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">卖家实际支付多少？</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">以 Settlement Details / Report 的费用行为准</text></g><g transform="translate(64 440)"><rect width="1272" height="110" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="240" height="110" rx="22" fill="#ed168c"/><text x="120" y="65" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">贡献利润</text><text x="280" y="48" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">这笔增量是否值得？</text><text x="280" y="80" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">增量收入减商品、履约、退货与推广成本</text></g></svg>
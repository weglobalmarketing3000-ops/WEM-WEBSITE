<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="690"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="72" y="82" font-family="Arial" font-size="42" font-weight="700" fill="#18275e">BFCM RETURN LIABILITY CALENDAR</text><rect x="70" y="112" width="1160" height="88" rx="18" fill="#fff"/><text x="104" y="166" font-family="Arial" font-size="24" font-weight="700" fill="#3148aa">SCOPE</text><text x="330" y="166" font-family="Arial" font-size="23" fill="#283653">Sold Nov 11, 16:00 PT to Dec 31, 23:59 PT</text><rect x="70" y="218" width="1160" height="88" rx="18" fill="#e9e5ff"/><text x="104" y="272" font-family="Arial" font-size="24" font-weight="700" fill="#3148aa">WINDOW</text><text x="330" y="272" font-family="Arial" font-size="23" fill="#283653">Eligible shoppers can return until Feb 10, 2027</text><rect x="70" y="324" width="1160" height="88" rx="18" fill="#fff"/><text x="104" y="378" font-family="Arial" font-size="24" font-weight="700" fill="#3148aa">PRIORITY</text><text x="330" y="378" font-family="Arial" font-size="23" fill="#283653">BFCM window overrides a seller-configured window</text><rect x="70" y="430" width="1160" height="88" rx="18" fill="#e9e5ff"/><text x="104" y="484" font-family="Arial" font-size="24" font-weight="700" fill="#3148aa">EXCEPTIONS</text><text x="330" y="484" font-family="Arial" font-size="23" fill="#283653">Selected categories use standard rules; auctions excluded</text><rect x="70" y="536" width="1160" height="88" rx="18" fill="#fff"/><text x="104" y="590" font-family="Arial" font-size="24" font-weight="700" fill="#3148aa">ACTION</text><text x="330" y="590" font-family="Arial" font-size="23" fill="#283653">Assign SKU owners, reserve, evidence and SLA ledger</text></svg>
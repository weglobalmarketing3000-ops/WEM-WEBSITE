<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="690"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="72" y="82" font-family="Arial" font-size="42" font-weight="700" fill="#18275e">退货申请决策闸门</text><rect x="70" y="145" width="360" height="420" rx="28" fill="#fff"/><circle cx="128" cy="205" r="24" fill="#ff2a9d"/><text x="168" y="216" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">常规</text><text x="104" y="300" font-family="Arial" font-size="22" fill="#283653">规则明确、证据完整</text><path d="M104 350h292" stroke="#d4cef5" stroke-width="4"/><text x="104" y="420" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">按文件化规则处理</text><rect x="465" y="145" width="360" height="420" rx="28" fill="#e9e5ff"/><circle cx="523" cy="205" r="24" fill="#ff2a9d"/><text x="563" y="216" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">例外</text><text x="499" y="300" font-family="Arial" font-size="22" fill="#283653">类目、订单类型或资格不清</text><path d="M499 350h292" stroke="#d4cef5" stroke-width="4"/><text x="499" y="420" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">转人工核对订单</text><rect x="860" y="145" width="360" height="420" rx="28" fill="#fff"/><circle cx="918" cy="205" r="24" fill="#ff2a9d"/><text x="958" y="216" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">升级</text><text x="894" y="300" font-family="Arial" font-size="22" fill="#283653">高价值、争议或损坏</text><path d="M894 350h292" stroke="#d4cef5" stroke-width="4"/><text x="894" y="420" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">指定 Owner 审核证据</text><text x="72" y="625" font-family="Arial" font-size="23" fill="#52618a">每一步都记录理由、证据、Owner 与下一截止时间</text></svg>
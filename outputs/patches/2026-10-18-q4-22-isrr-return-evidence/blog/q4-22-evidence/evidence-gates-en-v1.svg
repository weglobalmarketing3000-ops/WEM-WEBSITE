<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="84" font-family="Arial" font-size="42" font-weight="800" fill="#18275e">FOUR EVIDENCE GATES BEFORE A REJECTION</text><rect x="70" y="132" width="1160" height="104" rx="22" fill="#fff"/><circle cx="133" cy="184" r="34" fill="#7187e9"/><text x="113" y="194" font-family="Arial" font-size="25" font-weight="800" fill="#fff">01</text><text x="195" y="176" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">ORDER + REQUEST</text><text x="195" y="208" font-family="Arial" font-size="21" fill="#303957">Order, item, delivery, reason and current state</text><rect x="70" y="264" width="1160" height="104" rx="22" fill="#e9e5ff"/><circle cx="133" cy="316" r="34" fill="#7187e9"/><text x="113" y="326" font-family="Arial" font-size="25" font-weight="800" fill="#fff">02</text><text x="195" y="308" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">POLICY + ELIGIBILITY</text><text x="195" y="340" font-family="Arial" font-size="21" fill="#303957">Use the current rule, not team memory</text><rect x="70" y="396" width="1160" height="104" rx="22" fill="#fff"/><circle cx="133" cy="448" r="34" fill="#7187e9"/><text x="113" y="458" font-family="Arial" font-size="25" font-weight="800" fill="#fff">03</text><text x="195" y="440" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">EVIDENCE COHERENCE</text><text x="195" y="472" font-family="Arial" font-size="21" fill="#303957">Photos, inspection, logistics and messages agree</text><rect x="70" y="528" width="1160" height="104" rx="22" fill="#e9e5ff"/><circle cx="133" cy="580" r="34" fill="#7187e9"/><text x="113" y="590" font-family="Arial" font-size="25" font-weight="800" fill="#fff">04</text><text x="195" y="572" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">OUTCOME + APPEAL</text><text x="195" y="604" font-family="Arial" font-size="21" fill="#303957">Read back review, appeal and final order state</text></svg>
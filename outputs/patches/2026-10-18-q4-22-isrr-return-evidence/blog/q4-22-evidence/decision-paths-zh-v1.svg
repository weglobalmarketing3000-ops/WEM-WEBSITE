<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="690"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="84" font-family="Arial" font-size="36" font-weight="800" fill="#18275e">证据回读后，只进入三条路径</text><rect x="70" y="155" width="350" height="420" rx="30" fill="#fff" stroke="#d8d4f2" stroke-width="5"/><rect x="70" y="155" width="350" height="88" rx="30" fill="#7187e9"/><text x="98" y="210" font-family="Arial" font-size="23" font-weight="800" fill="#fff">继续审核</text><circle cx="112" cy="310" r="8" fill="#ff4aa7"/><text x="136" y="318" font-family="Arial" font-size="21" fill="#27304f">事实完整</text><circle cx="112" cy="392" r="8" fill="#ff4aa7"/><text x="136" y="400" font-family="Arial" font-size="21" fill="#27304f">资格明确</text><circle cx="112" cy="474" r="8" fill="#ff4aa7"/><text x="136" y="482" font-family="Arial" font-size="21" fill="#27304f">证据一致</text><rect x="465" y="155" width="350" height="420" rx="30" fill="#fff" stroke="#ff69b4" stroke-width="5"/><rect x="465" y="155" width="350" height="88" rx="30" fill="#ff7cbe"/><text x="493" y="210" font-family="Arial" font-size="23" font-weight="800" fill="#fff">暂停并补证</text><circle cx="507" cy="310" r="8" fill="#ff4aa7"/><text x="531" y="318" font-family="Arial" font-size="21" fill="#27304f">关键字段缺失</text><circle cx="507" cy="392" r="8" fill="#ff4aa7"/><text x="531" y="400" font-family="Arial" font-size="21" fill="#27304f">照片无法关联</text><circle cx="507" cy="474" r="8" fill="#ff4aa7"/><text x="531" y="482" font-family="Arial" font-size="21" fill="#27304f">记录互相冲突</text><rect x="860" y="155" width="350" height="420" rx="30" fill="#fff" stroke="#d8d4f2" stroke-width="5"/><rect x="860" y="155" width="350" height="88" rx="30" fill="#7187e9"/><text x="888" y="210" font-family="Arial" font-size="23" font-weight="800" fill="#fff">升级处理</text><circle cx="902" cy="310" r="8" fill="#ff4aa7"/><text x="926" y="318" font-family="Arial" font-size="21" fill="#27304f">规则边界不清</text><circle cx="902" cy="392" r="8" fill="#ff4aa7"/><text x="926" y="400" font-family="Arial" font-size="21" fill="#27304f">时钟即将到期</text><circle cx="902" cy="474" r="8" fill="#ff4aa7"/><text x="926" y="482" font-family="Arial" font-size="21" fill="#27304f">平台复核或申诉</text></svg>
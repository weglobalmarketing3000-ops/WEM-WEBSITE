<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="84" font-family="Arial" font-size="42" font-weight="800" fill="#18275e">拒绝决定的四个证据关口</text><rect x="70" y="132" width="1160" height="104" rx="22" fill="#fff"/><circle cx="133" cy="184" r="34" fill="#7187e9"/><text x="113" y="194" font-family="Arial" font-size="25" font-weight="800" fill="#fff">01</text><text x="195" y="176" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">订单与申请</text><text x="195" y="208" font-family="Arial" font-size="21" fill="#303957">订单、商品、配送、理由与当前状态</text><rect x="70" y="264" width="1160" height="104" rx="22" fill="#e9e5ff"/><circle cx="133" cy="316" r="34" fill="#7187e9"/><text x="113" y="326" font-family="Arial" font-size="25" font-weight="800" fill="#fff">02</text><text x="195" y="308" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">政策与资格</text><text x="195" y="340" font-family="Arial" font-size="21" fill="#303957">使用当前规则，不凭团队记忆</text><rect x="70" y="396" width="1160" height="104" rx="22" fill="#fff"/><circle cx="133" cy="448" r="34" fill="#7187e9"/><text x="113" y="458" font-family="Arial" font-size="25" font-weight="800" fill="#fff">03</text><text x="195" y="440" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">证据一致性</text><text x="195" y="472" font-family="Arial" font-size="21" fill="#303957">照片、验货、物流与沟通彼此解释</text><rect x="70" y="528" width="1160" height="104" rx="22" fill="#e9e5ff"/><circle cx="133" cy="580" r="34" fill="#7187e9"/><text x="113" y="590" font-family="Arial" font-size="25" font-weight="800" fill="#fff">04</text><text x="195" y="572" font-family="Arial" font-size="24" font-weight="800" fill="#2356d7">终态与申诉</text><text x="195" y="604" font-family="Arial" font-size="21" fill="#303957">记录平台复核、申诉与最终订单状态</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">EXPIRY AND REVIEW PLAN</title><desc id="desc">A reward tier stays valid only while its inputs stay valid.</desc>
  <rect width="1200" height="680" rx="34" fill="#f7f5f1"/><rect x="2" y="2" width="1196" height="676" rx="32" fill="none" stroke="#ded9cf" stroke-width="4"/>
  <rect x="64" y="62" width="10" height="112" rx="5" fill="#ff1493"/>
  <text x="104" y="110" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#171717">EXPIRY AND REVIEW PLAN</text>
  <text x="104" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#37332f">A reward tier stays valid only while its inputs stay valid.</text>
  <rect x="66" y="218" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="256" r="17" fill="#2457d6"/><text x="112" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">1</text><text x="150" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">PRICE OR BENEFIT CHANGES</text><text x="150" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">Re-read the live campaign threshold and visible account benefit.</text><text x="1060" y="266" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">REVISE</text>
  <rect x="66" y="316" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="354" r="17" fill="#2457d6"/><text x="112" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">2</text><text x="150" y="348" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">FEES OR RETURN RATE MOVES</text><text x="150" y="375" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">Refresh contribution with confirmed costs; keep unknowns visible.</text><text x="1060" y="364" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">REMODEL</text>
  <rect x="66" y="414" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="452" r="17" fill="#2457d6"/><text x="112" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">3</text><text x="150" y="446" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">INVENTORY OR SERVICE LOAD SHIFTS</text><text x="150" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">Check the SKU against its fulfillment and support boundary.</text><text x="1060" y="462" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">RESTRICT</text>
  <rect x="66" y="512" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="550" r="17" fill="#2457d6"/><text x="112" y="557" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">4</text><text x="150" y="544" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">REVIEW DATE ARRIVES</text><text x="150" y="571" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">Save the source, selected tier and registration readback.</text><text x="1060" y="560" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">KEEP / HOLD</text>
  <rect x="66" y="622" width="1068" height="4" rx="2" fill="url(#accent)"/><defs><linearGradient id="accent"><stop stop-color="#2457d6"/><stop offset="1" stop-color="#ff3b9d"/></linearGradient></defs>
</svg>

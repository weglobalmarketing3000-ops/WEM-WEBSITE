<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">到期与复核计划</title><desc id="desc">只有输入条件仍然成立，奖励层级才继续有效。</desc>
  <rect width="1200" height="680" rx="34" fill="#f7f5f1"/><rect x="2" y="2" width="1196" height="676" rx="32" fill="none" stroke="#ded9cf" stroke-width="4"/>
  <rect x="64" y="62" width="10" height="112" rx="5" fill="#ff1493"/>
  <text x="104" y="110" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#171717">到期与复核计划</text>
  <text x="104" y="154" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#37332f">只有输入条件仍然成立，奖励层级才继续有效。</text>
  <rect x="66" y="218" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="256" r="17" fill="#2457d6"/><text x="112" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">1</text><text x="150" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">价格或权益变化</text><text x="150" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">重新读取实时活动门槛与账户当前显示的权益。</text><text x="1060" y="266" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">改价</text>
  <rect x="66" y="316" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="354" r="17" fill="#2457d6"/><text x="112" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">2</text><text x="150" y="348" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">费用或退货率变化</text><text x="150" y="375" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">用已确认成本重算贡献，未知项继续标明待确认。</text><text x="1060" y="364" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">重算</text>
  <rect x="66" y="414" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="452" r="17" fill="#2457d6"/><text x="112" y="459" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">3</text><text x="150" y="446" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">库存或服务负荷变化</text><text x="150" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">检查 SKU 是否仍在履约与客服边界内。</text><text x="1060" y="462" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">限量</text>
  <rect x="66" y="512" width="1068" height="76" rx="18" fill="#ffffff" stroke="#ded9cf" stroke-width="2"/><circle cx="112" cy="550" r="17" fill="#2457d6"/><text x="112" y="557" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">4</text><text x="150" y="544" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#171717">到达复核日期</text><text x="150" y="571" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#625d56">保存来源、选定层级与报名完成后的读回。</text><text x="1060" y="560" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2457d6">保留 / 暂缓</text>
  <rect x="66" y="622" width="1068" height="4" rx="2" fill="url(#accent)"/><defs><linearGradient id="accent"><stop stop-color="#2457d6"/><stop offset="1" stop-color="#ff3b9d"/></linearGradient></defs>
</svg>

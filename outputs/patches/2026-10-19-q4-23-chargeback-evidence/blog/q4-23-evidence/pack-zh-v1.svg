<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="84" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">七天内的拒付证据包</text><rect x="70" y="145" width="1160" height="96" rx="22" fill="#fff"/><circle cx="133" cy="193" r="34" fill="#7187e9"/><text x="112" y="203" font-family="Arial" font-size="23" font-weight="800" fill="#fff">01</text><text x="195" y="189" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">时钟</text><text x="195" y="221" font-family="Arial" font-size="21" fill="#303957">通知、回复截止日、Owner</text><rect x="70" y="270" width="1160" height="96" rx="22" fill="#e9e5ff"/><circle cx="133" cy="318" r="34" fill="#7187e9"/><text x="112" y="328" font-family="Arial" font-size="23" font-weight="800" fill="#fff">02</text><text x="195" y="314" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">交易</text><text x="195" y="346" font-family="Arial" font-size="21" fill="#303957">订单状态、商品与订单确认</text><rect x="70" y="395" width="1160" height="96" rx="22" fill="#fff"/><circle cx="133" cy="443" r="34" fill="#7187e9"/><text x="112" y="453" font-family="Arial" font-size="23" font-weight="800" fill="#fff">03</text><text x="195" y="439" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">履约</text><text x="195" y="471" font-family="Arial" font-size="21" fill="#303957">追踪、签收与交付记录</text><rect x="70" y="520" width="1160" height="96" rx="22" fill="#e9e5ff"/><circle cx="133" cy="568" r="34" fill="#7187e9"/><text x="112" y="578" font-family="Arial" font-size="23" font-weight="800" fill="#fff">04</text><text x="195" y="564" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">变更</text><text x="195" y="596" font-family="Arial" font-size="21" fill="#303957">退款、取消与沟通记录</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="84" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">ROUTE BEFORE YOU SUBMIT</text><rect x="70" y="145" width="1160" height="124" rx="22" fill="#fff"/><circle cx="133" cy="207" r="34" fill="#7187e9"/><text x="112" y="217" font-family="Arial" font-size="23" font-weight="800" fill="#fff">CONTINUE</text><text x="195" y="213" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">Records complete and path is clear</text><rect x="70" y="305" width="1160" height="124" rx="22" fill="#e9e5ff"/><circle cx="133" cy="367" r="34" fill="#7187e9"/><text x="112" y="377" font-family="Arial" font-size="23" font-weight="800" fill="#fff">COMPLETE</text><text x="195" y="373" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">Order, delivery or message record missing</text><rect x="70" y="465" width="1160" height="124" rx="22" fill="#fff"/><circle cx="133" cy="527" r="34" fill="#7187e9"/><text x="112" y="537" font-family="Arial" font-size="23" font-weight="800" fill="#fff">ESCALATE</text><text x="195" y="533" font-family="Arial" font-size="25" font-weight="800" fill="#2356d7">Eligibility, policy or deadline at risk</text></svg>
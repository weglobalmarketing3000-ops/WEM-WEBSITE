<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="34" fill="#fff"/><text x="64" y="82" font-family="Arial,PingFang SC" font-size="39" font-weight="800" fill="#171717">Evidence pack: each file proves one named fact</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g><rect x="64" y="157" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="193" r="19" fill="#245bd7"/><text x="95" y="200" font-family="Arial" font-size="18" font-weight="800" fill="#fff">1</text><text x="145" y="189" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">CASE COVER</text><text x="145" y="214" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Order ID, reason, amount, reply-by date and owner</text></g><g><rect x="64" y="245" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="281" r="19" fill="#245bd7"/><text x="95" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#fff">2</text><text x="145" y="277" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">TRANSACTION</text><text x="145" y="302" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Status, product description, confirmation and changes</text></g><g><rect x="64" y="333" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="369" r="19" fill="#245bd7"/><text x="95" y="376" font-family="Arial" font-size="18" font-weight="800" fill="#fff">3</text><text x="145" y="365" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">DELIVERY</text><text x="145" y="390" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Tracking, POD and records linked to this order</text></g><g><rect x="64" y="421" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="457" r="19" fill="#245bd7"/><text x="95" y="464" font-family="Arial" font-size="18" font-weight="800" fill="#fff">4</text><text x="145" y="453" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">PRODUCT</text><text x="145" y="478" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Order-time listing, SKU, photos, packing and inspection</text></g><g><rect x="64" y="509" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="545" r="19" fill="#245bd7"/><text x="95" y="552" font-family="Arial" font-size="18" font-weight="800" fill="#fff">5</text><text x="145" y="541" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">COMMUNICATION</text><text x="145" y="566" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">On-platform messages, refunds, cancellation or remedy</text></g><g><rect x="64" y="597" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="633" r="19" fill="#245bd7"/><text x="95" y="640" font-family="Arial" font-size="18" font-weight="800" fill="#fff">6</text><text x="145" y="629" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">READBACK</text><text x="145" y="654" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Uploaded file list, timestamp, status and final outcome</text></g></svg>
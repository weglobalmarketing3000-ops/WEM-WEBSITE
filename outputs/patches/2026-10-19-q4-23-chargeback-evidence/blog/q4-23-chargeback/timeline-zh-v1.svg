<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" rx="34" fill="#fff"/><text x="64" y="82" font-family="Arial,PingFang SC" font-size="39" font-weight="800" fill="#171717">七天倒计时：按不可逆节点排队</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#ed168c"/><g><rect x="64" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="92" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 0</text><text x="92" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">接收通知</text><foreignObject x="92" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">保存案件、原因、Reply-by Date</div></foreignObject></g><g><rect x="494" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="522" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 1</text><text x="522" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">分配 Owner</text><foreignObject x="522" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">按原因列出必须证明的事实</div></foreignObject></g><g><rect x="924" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="952" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 2–4</text><text x="952" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">补齐证据</text><foreignObject x="952" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">物流、交易、商品与沟通记录</div></foreignObject></g><g><rect x="64" y="410" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="92" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 5</text><text x="92" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">独立复核</text><foreignObject x="92" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">删除无关材料，检查矛盾</div></foreignObject></g><g><rect x="494" y="410" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="522" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 6</text><text x="522" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">提交并回读</text><foreignObject x="522" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">确认文件、状态与时间戳</div></foreignObject></g><g><rect x="924" y="410" width="390" height="190" rx="24" fill="#fff3f9" stroke="#d8d1ef"/><text x="952" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 7</text><text x="952" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">只作缓冲</text><foreignObject x="952" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">不要把最后一天当计划</div></foreignObject></g></svg>
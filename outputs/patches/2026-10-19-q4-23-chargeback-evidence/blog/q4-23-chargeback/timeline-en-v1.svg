<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" rx="34" fill="#fff"/><text x="64" y="82" font-family="Arial,PingFang SC" font-size="39" font-weight="800" fill="#171717">Seven-day clock: queue by irreversible events</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#ed168c"/><g><rect x="64" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="92" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 0</text><text x="92" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">CAPTURE</text><foreignObject x="92" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Save case, reason and reply-by date</div></foreignObject></g><g><rect x="494" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="522" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 1</text><text x="522" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">ASSIGN</text><foreignObject x="522" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Name an owner and required facts</div></foreignObject></g><g><rect x="924" y="175" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="952" y="221" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 2–4</text><text x="952" y="266" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">COMPLETE</text><foreignObject x="952" y="287" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Collect delivery, transaction and product proof</div></foreignObject></g><g><rect x="64" y="410" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="92" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 5</text><text x="92" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">REVIEW</text><foreignObject x="92" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Remove noise and resolve contradictions</div></foreignObject></g><g><rect x="494" y="410" width="390" height="190" rx="24" fill="#f2efff" stroke="#d8d1ef"/><text x="522" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 6</text><text x="522" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">SUBMIT</text><foreignObject x="522" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Read back files, status and timestamp</div></foreignObject></g><g><rect x="924" y="410" width="390" height="190" rx="24" fill="#fff3f9" stroke="#d8d1ef"/><text x="952" y="456" font-family="Arial,PingFang SC" font-size="18" font-weight="800" fill="#245bd7">DAY 7</text><text x="952" y="501" font-family="Arial,PingFang SC" font-size="27" font-weight="800" fill="#171717">BUFFER</text><foreignObject x="952" y="522" width="330" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial,'PingFang SC';line-height:1.4;color:#514b57">Do not use the last day as the plan</div></foreignObject></g></svg>
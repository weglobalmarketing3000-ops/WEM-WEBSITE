<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="34" fill="#fff"/><text x="64" y="82" font-family="Arial,PingFang SC" font-size="39" font-weight="800" fill="#171717">证据包：每个文件证明一个具名事实</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g><rect x="64" y="157" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="193" r="19" fill="#245bd7"/><text x="95" y="200" font-family="Arial" font-size="18" font-weight="800" fill="#fff">1</text><text x="145" y="189" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">案件封面</text><text x="145" y="214" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">Order ID、拒付原因、金额、Reply-by Date、Owner</text></g><g><rect x="64" y="245" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="281" r="19" fill="#245bd7"/><text x="95" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#fff">2</text><text x="145" y="277" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">交易事实</text><text x="145" y="302" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">交易状态、商品描述、订单确认与变更记录</text></g><g><rect x="64" y="333" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="369" r="19" fill="#245bd7"/><text x="95" y="376" font-family="Arial" font-size="18" font-weight="800" fill="#fff">3</text><text x="145" y="365" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">交付证据</text><text x="145" y="390" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">运单、轨迹、签收或能连接订单的交付证明</text></g><g><rect x="64" y="421" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="457" r="19" fill="#245bd7"/><text x="95" y="464" font-family="Arial" font-size="18" font-weight="800" fill="#fff">4</text><text x="145" y="453" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">商品证据</text><text x="145" y="478" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">下单时 Listing、SKU、照片、打包或质检记录</text></g><g><rect x="64" y="509" width="1272" height="72" rx="18" fill="#f1eeff"/><circle cx="101" cy="545" r="19" fill="#245bd7"/><text x="95" y="552" font-family="Arial" font-size="18" font-weight="800" fill="#fff">5</text><text x="145" y="541" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">沟通与处理</text><text x="145" y="566" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">站内消息、退款、取消、换货或已达成协议</text></g><g><rect x="64" y="597" width="1272" height="72" rx="18" fill="#fbf9ff"/><circle cx="101" cy="633" r="19" fill="#245bd7"/><text x="95" y="640" font-family="Arial" font-size="18" font-weight="800" fill="#fff">6</text><text x="145" y="629" font-family="Arial,PingFang SC" font-size="21" font-weight="800" fill="#171717">提交回执</text><text x="145" y="654" font-family="Arial,PingFang SC" font-size="17" fill="#514b57">上传文件清单、提交时间、状态与最终结果</text></g></svg>
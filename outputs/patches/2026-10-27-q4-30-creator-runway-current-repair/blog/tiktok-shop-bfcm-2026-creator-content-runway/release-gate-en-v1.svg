<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520"><rect width="100%" height="100%" fill="#f5f3ff"/><text x="60" y="78" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="800" fill="#18275e">RELEASE SUPPORT ONLY AFTER A USEFUL SIGNAL</text><rect x="45" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="64" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">CONTENT LIVE</text><text x="64" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">Accurate product story</text><rect x="345" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="364" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">BUYER SIGNAL</text><text x="364" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">Questions + product interest</text><rect x="645" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="664" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">ECONOMICS</text><text x="664" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">Orders + margin context</text><rect x="945" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="964" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">NEXT TEST</text><text x="964" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">Repeat or amplify</text><text x="60" y="425" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#303957">Keep enough budget and time for the decision after the first content arrives.</text></svg>
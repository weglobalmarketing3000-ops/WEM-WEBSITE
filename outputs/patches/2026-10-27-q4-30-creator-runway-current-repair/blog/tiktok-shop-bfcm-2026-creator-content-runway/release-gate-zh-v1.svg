<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520"><rect width="100%" height="100%" fill="#f5f3ff"/><text x="60" y="78" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="800" fill="#18275e">出现有效信号，再释放下一轮支持</text><rect x="45" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="64" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">内容上线</text><text x="64" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">商品信息准确</text><rect x="345" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="364" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">买家信号</text><text x="364" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">问题 + 商品兴趣</text><rect x="645" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="664" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">商品经济</text><text x="664" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">订单 + 毛利背景</text><rect x="945" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="964" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">下一轮测试</text><text x="964" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">复投或放大</text><text x="60" y="425" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#303957">为第一批内容到达后的判断，保留预算和时间。</text></svg>
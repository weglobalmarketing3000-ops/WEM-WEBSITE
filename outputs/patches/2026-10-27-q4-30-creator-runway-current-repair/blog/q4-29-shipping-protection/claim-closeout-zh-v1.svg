<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC,sans-serif" font-size="40" font-weight="800" fill="#171717">案件关单读回</text><text x="64" y="124" font-family="Arial,PingFang SC,sans-serif" font-size="21" fill="#514b57">提交不是完成，状态与财务结果必须一起关闭。</text><rect x="64" y="146" width="150" height="6" rx="3" fill="#ed168c"/><g transform="translate(64 184)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#245bd7"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">实时状态</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">处理中、获批、拒绝或补充材料，按页面原样保存。</text></g><g transform="translate(64 292)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#ed168c"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">决定与金额</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">记录决定日期、页面金额和适用包裹，不做推测。</text></g><g transform="translate(64 400)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#245bd7"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">财务读回</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">把服务费、赔付与 Finance 记录分别核对。</text></g><g transform="translate(64 508)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#ed168c"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">负责人和下一步</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">未终结案件必须有 Owner、缺失证据与复核日期。</text></g><text x="1336" y="624" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#1746b8">WE MARKETING</text></svg>

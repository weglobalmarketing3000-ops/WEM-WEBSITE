<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC,sans-serif" font-size="40" font-weight="800" fill="#171717">CLAIM CLOSEOUT READBACK</text><text x="64" y="124" font-family="Arial,PingFang SC,sans-serif" font-size="21" fill="#514b57">Submission is not completion. Close status and finance together.</text><rect x="64" y="146" width="150" height="6" rx="3" fill="#ed168c"/><g transform="translate(64 184)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#245bd7"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">LIVE STATUS</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">Save in process, approved, denied or evidence requested exactly as shown.</text></g><g transform="translate(64 292)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#ed168c"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">DECISION AND AMOUNT</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">Record the decision date, displayed amount and applicable package.</text></g><g transform="translate(64 400)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#245bd7"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">FINANCE READBACK</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">Reconcile the service fee, reimbursement and Finance record separately.</text></g><g transform="translate(64 508)"><rect width="1272" height="82" rx="21" fill="#fff" stroke="#d8d1ef"/><rect width="270" height="82" rx="21" fill="#ed168c"/><text x="135" y="51" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="20" font-weight="800" fill="#fff">OWNER AND NEXT STEP</text><text x="306" y="51" font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#37332f">Every open case needs an owner, missing evidence and review date.</text></g><text x="1336" y="624" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#1746b8">WE MARKETING</text></svg>

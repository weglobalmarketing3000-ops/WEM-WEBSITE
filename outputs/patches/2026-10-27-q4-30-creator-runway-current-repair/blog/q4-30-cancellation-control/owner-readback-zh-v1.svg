<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520"><rect width="100%" height="100%" fill="#f5f3ff"/><text x="60" y="78" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="800" fill="#18275e">一个案件，三类负责人，一个终态读回</text><rect x="45" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="64" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">客服</text><text x="64" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">受理 + 买家更新</text><rect x="345" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="364" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">履约</text><text x="364" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">拣货 + 打包 + 交接</text><rect x="645" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="664" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">案件负责人</text><text x="664" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">操作 + 终态</text><rect x="945" y="180" width="245" height="145" rx="22" fill="#fff" stroke="#8899e8"/><text x="964" y="245" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#18275e">对账</text><text x="964" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#303957">退款 + 结算</text><text x="60" y="425" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#303957">只有平台结果和所需证据都可见，案件才算关闭。</text></svg>
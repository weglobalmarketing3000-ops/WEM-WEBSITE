<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC" font-size="38" font-weight="800" fill="#171717">从优惠承诺到退货处理，只能有一套事实</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g transform="translate(64 150)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#245bd7"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">商品页与内容</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">组件、数量、规格、赠品和限制一致</text></g><g transform="translate(64 262)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#ed168c"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">拣货与打包</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">每个组件、包裹、标签与交接可读回</text></g><g transform="translate(64 374)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#245bd7"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">订单与追踪</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">组合 PID 连接组件、包裹与交付状态</text></g><g transform="translate(64 486)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#ed168c"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">退货与退款</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">明确单品或整组退回、退款与不能替换的边界</text></g></svg>
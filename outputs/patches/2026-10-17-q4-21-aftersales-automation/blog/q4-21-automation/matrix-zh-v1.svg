<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#18275e">售后自动化权限矩阵</text><rect x="70" y="120" width="1160" height="125" rx="22" fill="#fff"/><text x="105" y="168" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">自动批准</text><text x="360" y="168" font-family="Arial" font-size="23" fill="#283653">低金额、规则明确、证据完整</text><text x="360" y="208" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">记录规则版本与结果</text><rect x="70" y="275" width="1160" height="125" rx="22" fill="#e9e5ff"/><text x="105" y="323" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">人工审核</text><text x="360" y="323" font-family="Arial" font-size="23" fill="#283653">原因或商品状态不清</text><text x="360" y="363" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">补证据并指定 Owner</text><rect x="70" y="430" width="1160" height="125" rx="22" fill="#fff"/><text x="105" y="478" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">必须升级</text><text x="360" y="478" font-family="Arial" font-size="23" fill="#283653">高价值、争议、欺诈或政策冲突</text><text x="360" y="518" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">暂停自动化并升级</text></svg>
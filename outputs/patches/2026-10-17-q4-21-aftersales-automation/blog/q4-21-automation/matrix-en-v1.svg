<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#18275e">AFTERSALES AUTOMATION AUTHORITY MATRIX</text><rect x="70" y="120" width="1160" height="125" rx="22" fill="#fff"/><text x="105" y="168" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">AUTO-APPROVE</text><text x="360" y="168" font-family="Arial" font-size="23" fill="#283653">Low value, clear rule, complete evidence</text><text x="360" y="208" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">Log rule version and outcome</text><rect x="70" y="275" width="1160" height="125" rx="22" fill="#e9e5ff"/><text x="105" y="323" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">HUMAN REVIEW</text><text x="360" y="323" font-family="Arial" font-size="23" fill="#283653">Reason or item state is unclear</text><text x="360" y="363" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">Collect evidence and assign owner</text><rect x="70" y="430" width="1160" height="125" rx="22" fill="#fff"/><text x="105" y="478" font-family="Arial" font-size="25" font-weight="700" fill="#3148aa">ESCALATE</text><text x="360" y="478" font-family="Arial" font-size="23" fill="#283653">High value, dispute, fraud or policy conflict</text><text x="360" y="518" font-family="Arial" font-size="22" font-weight="700" fill="#18275e">Stop automation and escalate</text></svg>
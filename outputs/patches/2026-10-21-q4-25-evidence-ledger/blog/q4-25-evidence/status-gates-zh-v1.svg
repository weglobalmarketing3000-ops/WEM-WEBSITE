<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="75" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">状态必须由读回决定</text><text x="70" y="120" font-family="Arial" font-size="24" fill="#4a5270">文件准备好，不等于动作已提交；动作已提交，也不等于案件已结束。</text><rect x="70" y="175" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="217" r="24" fill="#2356d7"/><text x="112" y="225" font-family="Arial" font-size="18" font-weight="800" fill="#fff">1</text><text x="170" y="225" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">草稿</text><text x="470" y="225" font-family="Arial" font-size="22" fill="#303957">未提交</text><text x="850" y="225" font-family="Arial" font-size="22" font-weight="700" fill="#2356d7">继续核对</text><rect x="70" y="287" width="1160" height="84" rx="22" fill="#ece9ff" stroke="#8798e9"/><circle cx="120" cy="329" r="24" fill="#2356d7"/><text x="112" y="337" font-family="Arial" font-size="18" font-weight="800" fill="#fff">2</text><text x="170" y="337" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">已提交</text><text x="470" y="337" font-family="Arial" font-size="22" fill="#303957">有确认读回</text><text x="850" y="337" font-family="Arial" font-size="22" font-weight="700" fill="#2356d7">等待结果</text><rect x="70" y="399" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="441" r="24" fill="#ff78bd"/><text x="112" y="449" font-family="Arial" font-size="18" font-weight="800" fill="#fff">3</text><text x="170" y="449" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">终态</text><text x="470" y="449" font-family="Arial" font-size="22" fill="#303957">有系统结果</text><text x="850" y="449" font-family="Arial" font-size="22" font-weight="700" fill="#2356d7">关闭并保留</text></svg>
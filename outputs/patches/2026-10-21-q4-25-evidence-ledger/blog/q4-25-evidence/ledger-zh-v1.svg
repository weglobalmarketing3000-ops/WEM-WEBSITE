<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="75" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">一条订单，一条可复核的事实链</text><rect x="70" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="172" cy="225" r="30" fill="#2356d7"/><text x="160" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">1</text><text x="92" y="290" font-family="Arial" font-size="21" font-weight="800" fill="#18275e">订单事实</text><path d="M277 267h28" stroke="#7187e9" stroke-width="8"/><rect x="310" y="180" width="205" height="175" rx="26" fill="#e9e5ff" stroke="#8798e9"/><circle cx="412" cy="225" r="30" fill="#2356d7"/><text x="400" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">2</text><text x="332" y="290" font-family="Arial" font-size="21" font-weight="800" fill="#18275e">履约读回</text><path d="M517 267h28" stroke="#7187e9" stroke-width="8"/><rect x="550" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="652" cy="225" r="30" fill="#2356d7"/><text x="640" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">3</text><text x="572" y="290" font-family="Arial" font-size="21" font-weight="800" fill="#18275e">售后决定</text><path d="M757 267h28" stroke="#7187e9" stroke-width="8"/><rect x="790" y="180" width="205" height="175" rx="26" fill="#e9e5ff" stroke="#8798e9"/><circle cx="892" cy="225" r="30" fill="#2356d7"/><text x="880" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">4</text><text x="812" y="290" font-family="Arial" font-size="21" font-weight="800" fill="#18275e">申诉包</text><path d="M997 267h28" stroke="#7187e9" stroke-width="8"/><rect x="1030" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="1132" cy="225" r="30" fill="#2356d7"/><text x="1120" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">5
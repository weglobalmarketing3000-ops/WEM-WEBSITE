<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="78" font-family="Arial" font-size="38" font-weight="800" fill="#18275e">六张图，不是六个随机角度</text><rect x="70" y="118" width="1160" height="71" rx="20" fill="#fff"/><circle cx="125" cy="153.5" r="29" fill="#7187e9"/><text x="107" y="161.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">01</text><text x="178" y="149" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">身份</text><text x="440" y="149" font-family="Arial" font-size="20" fill="#303957">退货标签、订单或追踪标识</text><rect x="70" y="201" width="1160" height="71" rx="20" fill="#e9e5ff"/><circle cx="125" cy="236.5" r="29" fill="#7187e9"/><text x="107" y="244.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">02</text><text x="178" y="232" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">外箱</text><text x="440" y="232" font-family="Arial" font-size="20" fill="#303957">六面外观、封口与运输损伤</text><rect x="70" y="284" width="1160" height="71" rx="20" fill="#fff"/><circle cx="125" cy="319.5" r="29" fill="#7187e9"/><text x="107" y="327.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">03</text><text x="178" y="315" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">全套</text><text x="440" y="315" font-family="Arial" font-size="20" fill="#303957">商品、配件、赠品与包装</text><rect x="70" y="367" width="1160" height="71" rx="20" fill="#e9e5ff"/><circle cx="125" cy="402.5" r="29" fill="#7187e9"/><text x="107" y="410.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">04</text><text x="178" y="398" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">正面</text><text x="440" y="398" font-family="Arial" font-size="20" fill="#303957">商品全貌和当前状态</text><rect x="70" y="450" width="1160" height="71" rx="20" fill="#fff"/><circle cx="125" cy="485.5" r="29" fill="#7187e9"/><text x="107" y="493.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">05</text><text x="178" y="481" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">问题</text><text x="440" y="481" font-family="Arial" font-size="20" fill="#303957">近景、尺度与缺陷位置</text><rect x="70" y="533" width="1160" height="71" rx="20" fill="#e9e5ff"/><circle cx="125" cy="568.5" r="29" fill="#7187e9"/><text x="107" y="576.5" font-family="Arial" font-size="20" font-weight="800" fill="#fff">06</text><text x="178" y="564" font-family="Arial" font-size="23" font-weight="800" fill="#2356d7">功能</text><text x="440" y="564" font-family="Arial" font-size="20" fill="#303957">可复现的功能结果或测试状态</text></svg>
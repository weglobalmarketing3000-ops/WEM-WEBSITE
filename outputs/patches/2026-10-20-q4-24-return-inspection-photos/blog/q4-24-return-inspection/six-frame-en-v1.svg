<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="34" fill="#fff"/><text x="64" y="82" font-family="Arial,PingFang SC" font-size="39" font-weight="800" fill="#171717">Six inspection frames: one question per image</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#ed168c"/><g><rect x="64" y="160" width="390" height="246" rx="24" fill="#f2efff" stroke="#d8d1ef"/><rect x="90" y="186" width="70" height="34" rx="17" fill="#245bd7"/><text x="105" y="209" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">01</text><text x="90" y="256" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">01 LABEL + PARCEL</text><text x="90" y="297" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">Is this the same return?</text><foreignObject x="90" y="317" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">Return label, all parcel sides and seal condition</div></foreignObject></g><g><rect x="494" y="160" width="390" height="246" rx="24" fill="#fbf9ff" stroke="#d8d1ef"/><rect x="520" y="186" width="70" height="34" rx="17" fill="#245bd7"/><text x="535" y="209" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">02</text><text x="520" y="256" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">02 ALL CONTENTS</text><text x="520" y="297" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">What came back?</text><foreignObject x="520" y="317" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">Item, accessories, gifts and packaging together</div></foreignObject></g><g><rect x="924" y="160" width="390" height="246" rx="24" fill="#f2efff" stroke="#d8d1ef"/><rect x="950" y="186" width="70" height="34" rx="17" fill="#245bd7"/><text x="965" y="209" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">03</text><text x="950" y="256" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">03 PRODUCT ID</text><text x="950" y="297" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">Is it the ordered item?</text><foreignObject x="950" y="317" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">SKU, model, serial, size or color identifiers</div></foreignObject></g><g><rect x="64" y="450" width="390" height="246" rx="24" fill="#fbf9ff" stroke="#d8d1ef"/><rect x="90" y="476" width="70" height="34" rx="17" fill="#245bd7"/><text x="105" y="499" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">04</text><text x="90" y="546" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">04 OVERALL CONDITION</text><text x="90" y="587" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">What is the total condition?</text><foreignObject x="90" y="607" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">Front, back and visible signs of use</div></foreignObject></g><g><rect x="494" y="450" width="390" height="246" rx="24" fill="#f2efff" stroke="#d8d1ef"/><rect x="520" y="476" width="70" height="34" rx="17" fill="#245bd7"/><text x="535" y="499" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">05</text><text x="520" y="546" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">05 ISSUE CLOSE-UP</text><text x="520" y="587" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">What fact changes the decision?</text><foreignObject x="520" y="607" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">Damage, contamination, missing part, seal or tag</div></foreignObject></g><g><rect x="924" y="450" width="390" height="246" rx="24" fill="#fbf9ff" stroke="#d8d1ef"/><rect x="950" y="476" width="70" height="34" rx="17" fill="#245bd7"/><text x="965" y="499" font-family="Arial,PingFang SC" font-size="15" font-weight="800" fill="#fff">06</text><text x="950" y="546" font-family="Arial,PingFang SC" font-size="23" font-weight="800" fill="#171717">06 FUNCTION + SCALE</text><text x="950" y="587" font-family="Arial,PingFang SC" font-size="19" font-weight="700" fill="#245bd7">Does it affect use or resale?</text><foreignObject x="950" y="607" width="334" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial,'PingFang SC';line-height:1.45;color:#514b57">Function test, measurement and reference scale</div></foreignObject></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#18275e">每笔自动化决定的五步回读</text><circle cx="155" cy="250" r="58" fill="#7187e9"/><text x="138" y="268" font-family="Arial" font-size="42" font-weight="700" fill="#fff">1</text><rect x="65" y="350" width="205" height="125" rx="22" fill="#fff"/><text x="83" y="402" font-family="Arial" font-size="18" font-weight="700" fill="#18275e">识别订单<tspan x="83" dy="28">与请求</tspan></text><path d="M220 250h80" stroke="#ff2a9d" stroke-width="8"/><circle cx="400" cy="250" r="58" fill="#7187e9"/><text x="383" y="268" font-family="Arial" font-size="42" font-weight="700" fill="#fff">2</text><rect x="310" y="350" width="205" height="125" rx="22" fill="#fff"/><text x="328" y="402" font-family="Arial" font-size="18" font-weight="700" fill="#18275e">核对资格<tspan x="328" dy="28">与例外</tspan></text><path d="M465 250h80" stroke="#ff2a9d" stroke-width="8"/><circle cx="645" cy="250" r="58" fill="#7187e9"/><text x="628" y="268" font-family="Arial" font-size="42" font-weight="700" fill="#fff">3</text><rect x="555" y="350" width="205" height="125" rx="22" fill="#fff"/><text x="573" y="402" font-family="Arial" font-size="18" font-weight="700" fill="#18275e">读取证据<tspan x="573" dy="28">与成本</tspan></text><path d="M710 250h80" stroke="#ff2a9d" stroke-width="8"/><circle cx="890" cy="250" r="58" fill="#7187e9"/><text x="873" y="268" font-family="Arial" font-size="42" font-weight="700" fill="#fff">4</text><rect x="800" y="350" width="205" height="125" rx="22" fill="#fff"/><text x="818" y="402" font-family="Arial" font-size="18" font-weight="700" fill="#18275e">批准、审核<tspan x="818" dy="28">或升级</tspan></text><path d="M955 250h80" stroke="#ff2a9d" stroke-width="8"/><circle cx="1135" cy="250" r="58" fill="#7187e9"/><text x="1118" y="268" font-family="Arial" font-size="42" font-weight="700" fill="#fff">5</text><rect x="1045" y="
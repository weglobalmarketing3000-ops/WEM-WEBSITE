<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520"><rect width="100%" height="100%" fill="#f5f3ff"/><text x="60" y="75" font-family="Arial" font-size="38" font-weight="800" fill="#18275e">虚拟组合装的同一事实链</text><rect x="45" y="180" width="205" height="150" rx="24" fill="#fff" stroke="#8899e8"/><text x="65" y="255" font-family="Arial" font-size="21" font-weight="700" fill="#18275e">商品页</text><rect x="290" y="180" width="205" height="150" rx="24" fill="#fff" stroke="#8899e8"/><text x="310" y="255" font-family="Arial" font-size="21" font-weight="700" fill="#18275e">组件 SKU</text><rect x="535" y="180" width="205" height="150" rx="24" fill="#fff" stroke="#8899e8"/><text x="555" y="255" font-family="Arial" font-size="21" font-weight="700" fill="#18275e">可售库存</text><rect x="780" y="180" width="205" height="150" rx="24" fill="#fff" stroke="#8899e8"/><text x="800" y="255" font-family="Arial" font-size="21" font-weight="700" fill="#18275e">拣货包裹</text><rect x="1025" y="180" width="205" height="150" rx="24" fill="#fff" stroke="#8899e8"/><text x="1045" y="255" font-family="Arial" font-size="21" font-weight="700" fill="#18275e">退货决定</text><text x="60" y="430" font-family="Arial" font-size="25" fill="#303957">每一环必须能回到同一份组件、数量和版本记录。</text></svg>
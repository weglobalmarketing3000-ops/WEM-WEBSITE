<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650"><rect width="1400" height="650" rx="34" fill="#f3f0ff"/><text x="64" y="84" font-family="Arial,PingFang SC" font-size="38" font-weight="800" fill="#171717">ONE TRUTH FROM OFFER PROMISE TO RETURN</text><rect x="64" y="112" width="150" height="6" rx="3" fill="#245bd7"/><g transform="translate(64 150)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#245bd7"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">PDP AND CONTENT</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">Components, counts, variants, gifts and limits agree</text></g><g transform="translate(64 262)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#ed168c"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">PICK AND PACK</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">Every component, parcel, label and handoff is readable</text></g><g transform="translate(64 374)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#245bd7"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">ORDER AND TRACKING</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">The bundle PID connects components, parcels and delivery state</text></g><g transform="translate(64 486)"><rect width="1272" height="88" rx="22" fill="#fff" stroke="#d8d1ef"/><rect width="260" height="88" rx="22" fill="#ed168c"/><text x="130" y="54" text-anchor="middle" font-family="Arial,PingFang SC" font-size="20" font-weight="800" fill="#fff">RETURN AND REFUND</text><text x="298" y="54" font-family="Arial,PingFang SC" font-size="19" fill="#3f3a43">Item or whole-bundle paths and replacement limits are explicit</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680"><rect width="1200" height="680" rx="34" fill="#f7f5f1"/><rect x="64" y="62" width="10" height="112" rx="5" fill="#ff1493"/><text x="104" y="110" font-family="Arial,PingFang SC" font-size="42" font-weight="800">到期与复核计划</text><text x="104" y="154" font-family="Arial,PingFang SC" font-size="23" fill="#37332f">输入变化时，重新确认奖励层级。</text><g transform="translate(66 220)"><rect width="1068" height="74" rx="18" fill="#fff" stroke="#ded9cf"/><circle cx="46" cy="37" r="17" fill="#2457d6"/><text x="46" y="44" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#fff">1</text><text x="84" y="46" font-family="Arial,PingFang SC" font-size="23" font-weight="800">价格或权益变化</text></g><g transform="translate(66 316)"><rect width="1068" height="74" rx="18" fill="#fff" stroke="#ded9cf"/><circle cx="46" cy="37" r="17" fill="#2457d6"/><text x="46" y="44" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#fff">2</text><text x="84" y="46" font-family="Arial,PingFang SC" font-size="23" font-weight="800">费用或退货率变化</text></g><g transform="translate(66 412)"><rect width="1068" height="74" rx="18" fill="#fff" stroke="#ded9cf"/><circle cx="46" cy="37" r="17" fill="#2457d6"/><text x="46" y="44" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#fff">3</text><text x="84" y="46" font-family="Arial,PingFang SC" font-size="23" font-weight="800">库存或服务负荷变化</text></g><g transform="translate(66 508)"><rect width="1068" height="74" rx="18" fill="#fff" stroke="#ded9cf"/><circle cx="46" cy="37" r="17" fill="#2457d6"/><text x="46" y="44" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#fff">4</text><text x="84" y="46" font-family="Arial,PingFang SC" font-size="23" font-weight="800">到达复核日期</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="80" y="100" font-size="48" font-family="Arial" font-weight="700" fill="#18275e">逐单 SLA 例外台账</text><rect x="80" y="160" width="1140" height="70" rx="16" fill="#fff"/><text x="110" y="205" font-size="27" font-family="Arial" font-weight="700" fill="#3045ac">订单类型</text><text x="460" y="205" font-size="27" font-family="Arial" fill="#273452">常规 / 预售 / 补货</text><rect x="80" y="252" width="1140" height="70" rx="16" fill="#e8e5ff"/><text x="110" y="297" font-size="27" font-family="Arial" font-weight="700" fill="#3045ac">下单时间</text><text x="460" y="297" font-size="27" font-family="Arial" fill="#273452">按订单记录，不按活动想象</text><rect x="80" y="344" width="1140" height="70" rx="16" fill="#fff"/><text x="110" y="389" font-size="27" font-family="Arial" font-weight="700" fill="#3045ac">适用规则</text><text x="460" y="389" font-size="27" font-family="Arial" fill="#273452">BFCM 窗口或标准 SLA</text><rect x="80" y="436" width="1140" height="70" rx="16" fill="#e8e5ff"/><text x="110" y="481" font-size="27" font-family="Arial" font-weight="700" fill="#3045ac">证据</text><text x="460" y="481" font-size="27" font-family="Arial" fill="#273452">状态、追踪、扫描、备注</text><rect x="80" y="528" width="1140" height="70" rx="16" fill="#fff"/><text x="110" y="573" font-size="27" font-family="Arial" font-weight="700" fill="#3045ac">下一步</text><text x="460" y="573" font-size="27" font-family="Arial" fill="#273452">分派并复核</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="75" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">TURN THE DASHBOARD INTO A DECISION</text><text x="70" y="120" font-family="Arial" font-size="24" fill="#4a5270">Attribution is observation; incrementality and contribution require comparison and settlement readback.</text><rect x="70" y="175" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="217" r="24" fill="#2356d7"/><text x="112" y="225" font-family="Arial" font-size="18" font-weight="800" fill="#fff">1</text><text x="170" y="225" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">OBSERVE</text><text x="430" y="225" font-family="Arial" font-size="21" fill="#303957">READ PANEL + SETTLEMENT</text><text x="850" y="225" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">NO GROWTH CLAIM</text><rect x="70" y="287" width="1160" height="84" rx="22" fill="#ece9ff" stroke="#8798e9"/><circle cx="120" cy="329" r="24" fill="#2356d7"/><text x="112" y="337" font-family="Arial" font-size="18" font-weight="800" fill="#fff">2</text><text x="170" y="337" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">COMPARE</text><text x="430" y="337" font-family="Arial" font-size="21" fill="#303957">HOLD OTHER LEVERS STEADY</text><text x="850" y="337" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">USE A COMPARABLE BASELINE</text><rect x="70" y="399" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="441" r="24" fill="#ff78bd"/><text x="112" y="449" font-family="Arial" font-size="18" font-weight="800" fill="#fff">3</text><text x="170" y="449" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">DECIDE</text><text x="430" y="449" font-family="Arial" font-size="21" fill="#303957">CALCULATE CONTRIBUTION + RISK</text><text x="850" y="449" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">KEEP, ADJUST OR EXIT</text></svg>
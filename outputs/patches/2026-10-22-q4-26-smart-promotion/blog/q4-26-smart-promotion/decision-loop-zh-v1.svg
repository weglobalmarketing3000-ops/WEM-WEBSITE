<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="75" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">把面板读数变成运营决定</text><text x="70" y="120" font-family="Arial" font-size="24" fill="#4a5270">归因是观察层；增量与贡献利润需要对照和结算读回。</text><rect x="70" y="175" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="217" r="24" fill="#2356d7"/><text x="112" y="225" font-family="Arial" font-size="18" font-weight="800" fill="#fff">1</text><text x="170" y="225" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">观察</text><text x="430" y="225" font-family="Arial" font-size="21" fill="#303957">读取面板与结算</text><text x="850" y="225" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">不下增长结论</text><rect x="70" y="287" width="1160" height="84" rx="22" fill="#ece9ff" stroke="#8798e9"/><circle cx="120" cy="329" r="24" fill="#2356d7"/><text x="112" y="337" font-family="Arial" font-size="18" font-weight="800" fill="#fff">2</text><text x="170" y="337" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">对照</text><text x="430" y="337" font-family="Arial" font-size="21" fill="#303957">保持其他变量稳定</text><text x="850" y="337" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">比较可比基线</text><rect x="70" y="399" width="1160" height="84" rx="22" fill="#fff" stroke="#8798e9"/><circle cx="120" cy="441" r="24" fill="#ff78bd"/><text x="112" y="449" font-family="Arial" font-size="18" font-weight="800" fill="#fff">3</text><text x="170" y="449" font-family="Arial" font-size="23" font-weight="800" fill="#18275e">决定</text><text x="430" y="449" font-family="Arial" font-size="21" fill="#303957">计算贡献与风险</text><text x="850" y="449" font-family="Arial" font-size="20" font-weight="700" fill="#2356d7">继续、调整或退出</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590"><rect width="100%" height="100%" fill="#f7f5ff"/><text x="70" y="75" font-family="Arial" font-size="39" font-weight="800" fill="#18275e">增长判断需要五层读数</text><rect x="70" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="172" cy="225" r="30" fill="#2356d7"/><text x="160" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">1</text><text x="88" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#18275e">平台归因销售额</text><rect x="310" y="180" width="205" height="175" rx="26" fill="#e9e5ff" stroke="#8798e9"/><circle cx="412" cy="225" r="30" fill="#2356d7"/><text x="400" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">2</text><text x="328" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#18275e">SP 实际费用</text><rect x="550" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="652" cy="225" r="30" fill="#2356d7"/><text x="640" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">3</text><text x="568" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#18275e">折扣与活动成本</text><rect x="790" y="180" width="205" height="175" rx="26" fill="#e9e5ff" stroke="#8798e9"/><circle cx="892" cy="225" r="30" fill="#2356d7"/><text x="880" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">4</text><text x="808" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#18275e">退货与取消</text><rect x="1030" y="180" width="205" height="175" rx="26" fill="#fff" stroke="#8798e9"/><circle cx="1132" cy="225" r="30" fill="#2356d7"/><text x="1120" y="233" font-family="Arial" font-size="19" font-weight="800" fill="#fff">5</text><text x="1048" y="288" font-family="Arial" font-size="18" font-weight="800" fill="#18275e">基线对照</text><text x="70" y="470" font-family="Arial" font-size="26" fill="#303957">先把费用和回流写完整，再问是否真的带来了新增销量。</text></svg>
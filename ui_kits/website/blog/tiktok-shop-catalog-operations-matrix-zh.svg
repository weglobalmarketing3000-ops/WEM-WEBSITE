<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">一种目录结构，五项运营检查</title><desc id="desc">所有面向消费者的商品结构都要通过同一套控制面。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12111d"/><stop offset="1" stop-color="#31214d"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff4fa3"/><stop offset="1" stop-color="#b688ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="960" fill="url(#bg)"/><circle cx="1430" cy="110" r="230" fill="#ff4fa3" opacity=".12"/><circle cx="150" cy="850" r="280" fill="#9a6cff" opacity=".12"/>
  <text x="92" y="112" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#ff93c7">WE MARKETING · TIKTOK SHOP US</text>
  <text x="92" y="185" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">一种目录结构，五项运营检查</text>
  <text x="92" y="230" font-family="Arial,sans-serif" font-size="25" fill="#ded6e8">所有面向消费者的商品结构都要通过同一套控制面。</text>
  <g filter="url(#shadow)"><rect x="120" y="340" width="260" height="300" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="152" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">IDENTITY</text><text x="152" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">商品真实身份</text><text x="152" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">SKU 与变体准确</text></g><g filter="url(#shadow)"><rect x="420" y="340" width="260" height="300" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="452" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">INVENTORY</text><text x="452" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">库存可用</text><text x="452" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">预留与预警</text></g><g filter="url(#shadow)"><rect x="720" y="340" width="260" height="300" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="752" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">FULFILLMENT</text><text x="752" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">履约承诺</text><text x="752" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">责任人清晰</text></g><g filter="url(#shadow)"><rect x="1020" y="340" width="260" height="300" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="1052" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">CREATORS</text><text x="1052" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">达人内容链接</text><text x="1052" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">卖什么就展示什么</text></g><g filter="url(#shadow)"><rect x="1320" y="340" width="190" height="300" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="1352" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">LIFECYCLE</text><text x="1352" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">持续复盘</text><text x="1352" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">及时修正</text></g>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">让 Deal 跟着 Evidence</title><desc id="desc">Commission 与 Flat Fee 是付款结构，Exclusive Collaboration 是邀请制项目。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">让 Deal 跟着 Evidence</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Commission 与 Flat Fee 是付款结构，Exclusive Collaboration 是邀请制项目。</text><g filter="url(#shadow)"><rect x="75" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">DISCOVERY</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Commission-first</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Proof 低 · 可选发布</text></g><g filter="url(#shadow)"><rect x="585" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="613" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">PRODUCTION</text><text x="613" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Flat Fee + Upside</text><text x="613" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Fit 强 · 明确 Video</text></g><g filter="url(#shadow)"><rect x="1095" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1123" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">RELATIONSHIP</text><text x="1123" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Program 或 Agreement</text><text x="1123" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Fit 已验证 · 条款清楚</text></g><rect x="110" y="675" width="1380" height="92" rx="24" fill="#171521"/><text x="160" y="733" font-family="Arial,sans-serif" font-size="27" fill="#fff">先写清 Collaboration Job，再决定双方怎么分担 Risk 与 Reward。</text></svg>
{"@type":"Question","name":"How do I find TikTok Shop creators for my brand?","acceptedAnswer":{"@type":"Answer","text":"Start with TikTok Shop's affiliate marketplace to browse active creators in your category. Filter by GMV performance, not follower count. For commission-only programs, L1 and L2 creators (up to $25K monthly GMV) are the sweet spot for volume and responsiveness. You can also work with a TikTok Shop agency that has a pre-built creator community for faster activation."}},
{"@type":"Question","name":"How many followers does a creator need to sell on TikTok Shop?","acceptedAnswer":{"@type":"Answer","text":"Creators need at least 1,000 followers to access TikTok Shop's affiliate features. However, follower count is a poor predictor of sales performance. Creators with smaller but engaged audiences often outperform larger accounts in conversion rate because their followers trust their recommendations more."}},
{"@type":"Question","name":"How long does it take for a creator to post after receiving a sample?","acceptedAnswer":{"@type":"Answer","text":"From sample shipment to published content, expect about two to three weeks. Shipping typically takes 3 to 5 days, and creators generally need another 3 to 5 days to produce content. Most programs give creators a 14-day window to post after receiving the product."}},
{"@type":"Question","name":"How do I contact TikTok creators about promoting my product?","acceptedAnswer":{"@type":"Answer","text":"You can reach TikTok Shop creators through the platform's built-in affiliate marketplace, through direct message on TikTok, or through email if listed in their bio. Email tends to get better response rates since TikTok DMs get buried. Lead with what's in it for the creator: commission rate, free product, and any additional incentives."}}

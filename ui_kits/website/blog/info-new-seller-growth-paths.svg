<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1200" fill="#0B0B0B"/>
  <rect x="64" y="64" width="1472" height="1072" rx="34" fill="#101010" stroke="#2F2F2F"/>
  <text x="108" y="142" fill="#FF4FAE" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">TIKTOK SHOP U.S. · NEW SELLER DECISION FRAME</text>
  <text x="108" y="198" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Which growth path should you choose first?</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#BBBBBB">
    <text x="108" y="262">A practical WEM view of when to start with short video, live, creators, campaigns, or Product GMV Max.</text>
  </g>
  <g>
    <rect x="108" y="312" width="1384" height="86" rx="18" fill="#171717"/>
    <text x="138" y="365" fill="#FF4FAE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Growth Path</text>
    <text x="420" y="365" fill="#FF4FAE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Best For</text>
    <text x="760" y="365" fill="#FF4FAE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">What Must Be Ready</text>
    <text x="1204" y="365" fill="#FF4FAE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Common Mistake</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22">
    <rect x="108" y="426" width="1384" height="126" rx="20" fill="#121212" stroke="#2A2A2A"/>
    <text x="138" y="478" fill="#FFFFFF" font-weight="700">Short Video</text>
    <text x="420" y="462" fill="#D4D4D4">Low-price or visually</text>
    <text x="420" y="492" fill="#D4D4D4">demonstrable SKUs</text>
    <text x="760" y="462" fill="#D4D4D4">Hero SKU, strong PDP,</text>
    <text x="760" y="492" fill="#D4D4D4">content testing loop</text>
    <text x="1204" y="462" fill="#D4D4D4">Posting more content</text>
    <text x="1204" y="492" fill="#D4D4D4">without conversion readiness</text>

    <rect x="108" y="574" width="1384" height="126" rx="20" fill="#121212" stroke="#2A2A2A"/>
    <text x="138" y="626" fill="#FFFFFF" font-weight="700">Livestream</text>
    <text x="420" y="610" fill="#D4D4D4">Simple demos and</text>
    <text x="420" y="640" fill="#D4D4D4">trust-led selling</text>
    <text x="760" y="610" fill="#D4D4D4">Host readiness, stable pricing,</text>
    <text x="760" y="640" fill="#D4D4D4">video and ad traffic support</text>
    <text x="1204" y="610" fill="#D4D4D4">Treating live as a standalone</text>
    <text x="1204" y="640" fill="#D4D4D4">channel with no operating support</text>

    <rect x="108" y="722" width="1384" height="126" rx="20" fill="#121212" stroke="#2A2A2A"/>
    <text x="138" y="774" fill="#FFFFFF" font-weight="700">Creator Collaboration</text>
    <text x="420" y="758" fill="#D4D4D4">Broad-audience products</text>
    <text x="420" y="788" fill="#D4D4D4">with clear content hooks</text>
    <text x="760" y="758" fill="#D4D4D4">Affiliate plan, commission logic,</text>
    <text x="760" y="788" fill="#D4D4D4">samples, creator-ready listing</text>
    <text x="1204" y="758" fill="#D4D4D4">Outreach before setup</text>
    <text x="1204" y="788" fill="#D4D4D4">and before sample readiness</text>

    <rect x="108" y="870" width="1384" height="126" rx="20" fill="#121212" stroke="#2A2A2A"/>
    <text x="138" y="922" fill="#FFFFFF" font-weight="700">Campaigns</text>
    <text x="420" y="906" fill="#D4D4D4">Stores that can already</text>
    <text x="420" y="936" fill="#D4D4D4">handle traffic spikes</text>
    <text x="760" y="906" fill="#D4D4D4">Eligibility, stock, discounts,</text>
    <text x="760" y="936" fill="#D4D4D4">campaign creatives and support</text>
    <text x="1204" y="906" fill="#D4D4D4">Using exposure to solve</text>
    <text x="1204" y="936" fill="#D4D4D4">weak fundamentals</text>

    <rect x="108" y="1018" width="1384" height="86" rx="20" fill="#151515" stroke="#2A2A2A"/>
    <text x="138" y="1071" fill="#FFFFFF" font-weight="700">Product GMV Max</text>
    <text x="420" y="1071" fill="#D4D4D4">Validated products and usable creative volume</text>
    <text x="900" y="1071" fill="#D4D4D4">Account linkage, authorized videos, test window</text>
    <text x="1306" y="1071" fill="#D4D4D4">Scaling before signal</text>

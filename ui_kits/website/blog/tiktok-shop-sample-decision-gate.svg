<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Route the sample by risk</title><desc id="desc">Choose the mode only after product, creator, operations, and learning are scored.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs><rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Route the sample by risk</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Choose the mode only after product, creator, operations, and learning are scored.</text><g filter="url(#shadow)"><rect x="65" y="310" width="450" height="260" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="93" y="354" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">CONTROLLED</text><text x="93" y="404" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Manual free</text><text x="93" y="447" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Nuanced fit · seller funds</text></g><g filter="url(#shadow)"><rect x="575" y="310" width="450" height="260" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="603" y="354" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">DISCOVERY</text><text x="603" y="404" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Refundable</text><text x="603" y="447" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Creator buys · sales unlock refund</text></g><g filter="url(#shadow)"><rect x="1085" y="310" width="450" height="260" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1113" y="354" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">SCALE</text><text x="1113" y="404" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Auto-approved</text><text x="1113" y="447" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Proven rules · bounded quota</text></g><rect x="120" y="680" width="1360" height="92" rx="24" fill="#171521"/><text x="165" y="737" font-family="Arial,sans-serif" font-size="27" fill="#fff">Product evidence first. Automation comes after a safe rule exists.</text></svg>
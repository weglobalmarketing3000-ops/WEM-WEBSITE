<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">每一层优惠只负责一个主要任务</title><desc id="desc">除非组合经过模拟、核算和批准，不要为同一个 Conversion Job 支付两次。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">每一层优惠只负责一个主要任务</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">除非组合经过模拟、核算和批准，不要为同一个 Conversion Job 支付两次。</text><g filter="url(#shadow)"><rect x="75" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">基础价值</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Product Discount</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">批准的基础优惠</text></g><g filter="url(#shadow)"><rect x="380" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#5a69e3" stroke-width="3"/><text x="408" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5a69e3">紧迫感</text><text x="408" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Flash / LIVE</text><text x="408" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">时间与库存上限</text></g><g filter="url(#shadow)"><rect x="685" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="713" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">用户行为</text><text x="713" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Coupon</text><text x="713" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">明确获得条件</text></g><g filter="url(#shadow)"><rect x="990" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#ad61d0" stroke-width="3"/><text x="1018" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ad61d0">提高客单</text><text x="1018" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">满件 / 运费</text><text x="1018" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">有价值的 Basket</text></g><g filter="url(#shadow)"><rect x="1295" y="315" width="230" height="235" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1323" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">活动入口</text><text x="1323" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Campaign</text><text x="1323" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">已确认条款</text></g><rect x="75" y="655" width="1450" height="94" rx="22" fill="#171521"/><text x="115" y="714" font-family="Arial,sans-serif" font-size="27" fill="#fff">一个消费者价格。每层一个任务。每层一个负责人。</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">One promotion ledger, one final price</title><desc id="desc">Keep ecommerce, CRM, creators, LIVE, campaigns and finance on the same evidence.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">One promotion ledger, one final price</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Keep ecommerce, CRM, creators, LIVE, campaigns and finance on the same evidence.</text><g filter="url(#shadow)"><rect x="90" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="118" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">SCOPE</text><text x="118" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">SKU + channel</text><text x="118" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Exact IDs and surface</text></g><g filter="url(#shadow)"><rect x="460" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#6667e1" stroke-width="3"/><text x="488" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6667e1">CONTROL</text><text x="488" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Time + stock</text><text x="488" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Start, end, limit</text></g><g filter="url(#shadow)"><rect x="830" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#9d62d5" stroke-width="3"/><text x="858" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#9d62d5">ECONOMICS</text><text x="858" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Price + funding</text><text x="858" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Floor and payer</text></g><g filter="url(#shadow)"><rect x="1200" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1228" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">OWNERSHIP</text><text x="1228" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Owner + evidence</text><text x="1228" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Simulator and settlement</text></g><path d="M400 430L445 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M429 414L445 430L429 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 430L815 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M799 414L815 430L799 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1140 430L1185 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1169 414L1185 430L1169 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="700" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Unknown funding stays out of the base forecast.</text></svg>
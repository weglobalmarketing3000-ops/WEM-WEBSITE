{"@type":"Question","name":"How many products should a new TikTok Shop seller promote first?","acceptedAnswer":{"@type":"Answer","text":"Start with one or two hero SKUs for short video testing. For creator collaboration, choose a small creator-ready group. TikTok Shop guidance recommends three to four flagship products rather than a broad catalog."}},
{"@type":"Question","name":"When should a new TikTok Shop seller use Product GMV Max?","acceptedAnswer":{"@type":"Answer","text":"Use Product GMV Max after account linkage is complete and you have authorized product videos, several usable creative options, and a small group of products showing content or conversion potential. Do not use it to cover up a weak listing or offer."}},
{"@type":"Question","name":"How long should a new seller let GMV Max run before judging it?","acceptedAnswer":{"@type":"Answer","text":"Give a new Product GMV Max campaign at least three days to learn before making a major decision. Review the creative, product page, offer, and conversion signals together, not only ad spend or GMV."}},
{"@type":"Question","name":"Should a new seller join TikTok Shop campaigns right away?","acceptedAnswer":{"@type":"Answer","text":"Join when the product, offer, inventory, listing, and fulfillment are ready. Campaigns can increase exposure, but they cannot repair a weak launch. Protect campaign inventory and prepare customer-service follow-through first."}},

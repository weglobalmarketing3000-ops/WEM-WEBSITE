<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Use the Promotion Simulator as a release gate</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Customer price and seller-funded economics must both pass before publishing.</text><g filter="url(#shadow)"><rect x="65" y="325" width="265" height="220" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="93" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">01</text><text x="93" y="419" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Ledger</text><text x="93" y="462" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Scope + owner</text></g><g filter="url(#shadow)"><rect x="365" y="325" width="265" height="220" rx="26" fill="#fff" stroke="#5c69e2" stroke-width="3"/><text x="393" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5c69e2">02</text><text x="393" y="419" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Simulate</text><text x="393" y="462" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Exact overlap</text></g><g filter="url(#shadow)"><rect x="665" y="325" width="265" height="220" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="693" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">03</text><text x="693" y="419" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Margin</text><text x="693" y="462" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Protected floor</text></g><g filter="url(#shadow)"><rect x="965" y="325" width="265" height="220" rx="26" fill="#fff" stroke="#b161cc" stroke-width="3"/><text x="993" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#b161cc">04</text><text x="993" y="419" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Test</text><text x="993" y="462" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Customer surface</text></g><g filter="url(#shadow)"><rect x="1265" y="325" width="265" height="220" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1293" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">05</text><text x="1293" y="419" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Read back</text><text x="1293" y="462" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Order settlement</text></g><path d="M330 435L350 435" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M334 419L350 435L334 451" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 435L650 435" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M634 419L650 435L634 451" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M930 435L950 435" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M934 419L950 435L934 451" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1230 435L1250 435" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1234 419L1250 435L1234 451" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="660" width="1465" height="90" rx="22" fill="#171521"/><text x="105" y="716" font-family="Arial,sans-serif" font-size="27" fill="#fff">Publish with a stock stop, margin stop, message owner and rollback path.</text></svg>
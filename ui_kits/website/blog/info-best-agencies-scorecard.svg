<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">TikTok Shop agency evaluation scorecard</title>
  <desc id="desc">A scorecard showing six evaluation criteria for choosing a TikTok Shop agency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".65" stop-color="#120015"/>
      <stop offset="1" stop-color="#03010a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset=".55" stop-color="#9b30ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="72" y="84" fill="#ff1493" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">SELECTION SCORECARD</text>
  <text x="72" y="146" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900">What “best TikTok Shop agency” should mean</text>
  <text x="72" y="192" fill="rgba(255,255,255,.72)" font-family="Arial, Helvetica, sans-serif" font-size="24">Use this framework before hiring any U.S. TikTok Shop partner.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#fff">
    <g transform="translate(72 270)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#ff1493"/>
      <text x="92" y="46" font-weight="900">TikTok Shop operations</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">Listings, product SEO, shop health, promotions, reporting.</text>
    </g>
    <g transform="translate(738 270)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#9b30ff"/>
      <text x="92" y="46" font-weight="900">Creator affiliate management</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">Recruiting, vetting, sampling, follow-up, commission strategy.</text>
    </g>
    <g transform="translate(72 410)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#00e5ff"/>
      <text x="92" y="46" font-weight="900">Content engine</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">UGC, live clips, product demos, ad-ready creative.</text>
    </g>
    <g transform="translate(738 410)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#c6ff3d"/>
      <text x="92" y="46" font-weight="900">Paid amplification</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">Spark Ads, TikTok Ads, creative testing, CPA discipline.</text>
    </g>
    <g transform="translate(72 550)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#f5a524"/>
      <text x="92" y="46" font-weight="900">Category fit</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">Beauty, wellness, CPG, fashion, home, Amazon/DTC expansion.</text>
    </g>
    <g transform="translate(738 550)">
      <rect width="590" height="105" rx="20" fill="#0b0b0d" stroke="rgba(255,255,255,.13)"/>
      <circle cx="54" cy="53" r="22" fill="#ffffff"/>
      <text x="92" y="46" font-weight="900">Proof and reporting</text>
      <text x="92" y="78" fill="rgba(255,255,255,.65)" font-size="18">Case studies, GMV, content volume, post rate, weekly insights.</text>
    </g>
  </g>
  <rect x="72" y="710" width="1256" height="46" rx="23" fill="url(#hot)" opacity=".95"/>
  <text x="700" y="741" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">The right agency is not just a media buyer. It is a commerce operations + creator network + content system.</text>
</svg>

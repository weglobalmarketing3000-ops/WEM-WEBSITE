<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">开启 Product GMV Max 前的五个 Gate</title><desc id="desc">每一个 Gate 都要有证据、负责人和 Stop Condition，商品才达到 Test-ready。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">开启 Product GMV Max 前的五个 Gate</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">每一个 Gate 都要有证据、负责人和 Stop Condition，商品才达到 Test-ready。</text><g filter="url(#shadow)"><rect x="75" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">01</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">商品真实度</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Listing + Promise</text></g><g filter="url(#shadow)"><rect x="380" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#5a69e3" stroke-width="3"/><text x="408" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5a69e3">02</text><text x="408" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Contribution</text><text x="408" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">广告后底线</text></g><g filter="url(#shadow)"><rect x="685" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="713" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">03</text><text x="713" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">转化准备</text><text x="713" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">PDP + Checkout</text></g><g filter="url(#shadow)"><rect x="990" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#ad61d0" stroke-width="3"/><text x="1018" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ad61d0">04</text><text x="1018" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">内容供给</text><text x="1018" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">已授权 Content Job</text></g><g filter="url(#shadow)"><rect x="1295" y="315" width="230" height="235" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1323" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">05</text><text x="1323" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">运营控制</text><text x="1323" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Owner + Stop</text></g><rect x="75" y="655" width="1450" height="94" rx="22" fill="#171521"/><text x="115" y="714" font-family="Arial,sans-serif" font-size="27" fill="#fff">放大一个准备好的系统，不要自动化一个已知问题。</text></svg>
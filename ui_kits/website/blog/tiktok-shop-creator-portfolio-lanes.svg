<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Run a three-lane creator portfolio</title><desc id="desc">Move creators when evidence improves, not because follower count looks impressive.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Run a three-lane creator portfolio</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Move creators when evidence improves, not because follower count looks impressive.</text><g filter="url(#shadow)"><rect x="80" y="315" width="410" height="250" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="108" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">LANE 1</text><text x="108" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Discovery</text><text x="108" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Commission · find fit</text></g><g filter="url(#shadow)"><rect x="595" y="315" width="410" height="250" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="623" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">LANE 2</text><text x="623" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Production</text><text x="623" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Fee + commission</text></g><g filter="url(#shadow)"><rect x="1110" y="315" width="410" height="250" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1138" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">LANE 3</text><text x="1138" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Relationship</text><text x="1138" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Repeat · program · terms</text></g><path d="M490 440L570 440" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M554 424L570 440L554 456" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1005 440L1085 440" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1069 424L1085 440L1069 456" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="716" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Monthly review:</text><text x="355" y="716" font-family="Arial,sans-serif" font-size="27" fill="#3168e8">SCALE</text><text x="555" y="716" font-family="Arial,sans-serif" font-size="27" fill="#8465df">REPEAT</text><text x="775" y="716" font-family="Arial,sans-serif" font-size="27" fill="#ad61d0">MOVE</text><text x="955" y="716" font-family="Arial,sans-serif" font-size="27" fill="#ed63a8">STOP</text></svg>
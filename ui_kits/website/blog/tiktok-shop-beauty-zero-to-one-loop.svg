<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">TikTok Shop Beauty zero-to-one cold-start loop</title>
  <desc id="desc">A WE Marketing operating framework connecting Hero SKU selection, creator fit, product proof, claims and listing, GMV Max, customer feedback, and the next scale, repair, or stop decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset="0.5" stop-color="#8d42ff"/>
      <stop offset="1" stop-color="#438cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8376a8"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1220" cy="110" r="180" fill="#ff1493" opacity="0.08" filter="url(#glow)"/>
  <circle cx="190" cy="650" r="200" fill="#438cff" opacity="0.08" filter="url(#glow)"/>
  <text x="74" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Beauty Cold Start: One Connected Proof System</text>
  <text x="74" y="118" fill="#aaa3bd" font-family="Arial, sans-serif" font-size="20">Every layer should produce evidence for the next commercial decision.</text>
  <path d="M290 285 H438 M622 285 H770 M954 285 H1102" stroke="#8376a8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1194 370 C1194 590 1010 630 700 630 C390 630 206 590 206 370" fill="none" stroke="#8376a8" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(74 190)">
      <rect width="216" height="190" rx="26" fill="#14121d" stroke="#ff1493" stroke-width="3"/>
      <circle cx="42" cy="44" r="18" fill="#ff1493"/>
      <text x="72" y="51" fill="#ffffff" font-size="20" font-weight="700">Hero SKU</text>
      <text x="28" y="96" fill="#cfc9dc" font-size="17">Product role</text>
      <text x="28" y="126" fill="#cfc9dc" font-size="17">Margin and stock</text>
      <text x="28" y="156" fill="#cfc9dc" font-size="17">Eligibility</text>
    </g>
    <g transform="translate(438 190)">
      <rect width="216" height="190" rx="26" fill="#14121d" stroke="#bd36e9" stroke-width="3"/>
      <circle cx="42" cy="44" r="18" fill="#bd36e9"/>
      <text x="72" y="51" fill="#ffffff" font-size="20" font-weight="700">Creator Fit</text>
      <text x="28" y="96" fill="#cfc9dc" font-size="17">Product affinity</text>
      <text x="28" y="126" fill="#cfc9dc" font-size="17">Audience context</text>
      <text x="28" y="156" fill="#cfc9dc" font-size="17">Demo ability</text>
    </g>
    <g transform="translate(770 190)">
      <rect width="216" height="190" rx="26" fill="#14121d" stroke="#7659ff" stroke-width="3"/>
      <circle cx="42" cy="44" r="18" fill="#7659ff"/>
      <text x="72" y="51" fill="#ffffff" font-size="20" font-weight="700">Proof + Trust</text>
      <text x="28" y="96" fill="#cfc9dc" font-size="17">Demonstration</text>
      <text x="28" y="126" fill="#cfc9dc" font-size="17">Claims and listing</text>
      <text x="28" y="156" fill="#cfc9dc" font-size="17">Offer clarity</text>
    </g>
    <g transform="translate(1102 190)">
      <rect width="224" height="190" rx="26" fill="#14121d" stroke="#438cff" stroke-width="3"/>
      <circle cx="42" cy="44" r="18" fill="#438cff"/>
      <text x="72" y="51" fill="#ffffff" font-size="20" font-weight="700">Scale Test</text>
      <text x="28" y="96" fill="#cfc9dc" font-size="17">Affiliate content</text>
      <text x="28" y="126" fill="#cfc9dc" font-size="17">GMV Max</text>
      <text x="28" y="156" fill="#cfc9dc" font-size="17">Customer signals</text>
    </g>
  </g>
  <g transform="translate(330 508)">
    <rect width="740" height="130" rx="32" fill="#0e0d14" stroke="url(#accent)" stroke-width="3"/>
    <text x="370" y="49" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Weekly Decision</text>
    <text x="160" y="96" text-anchor="middle" fill="#ff62b7" font-family="Arial, sans-serif" font-size="25" font-weight="700">SCALE</text>
    <text x="370" y="96" text-anchor="middle" fill="#b783ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">REPAIR</text>
    <text x="580" y="96" text-anchor="middle" fill="#76adff" font-family="Arial, sans-serif" font-size="25" font-weight="700">STOP</text>
  </g>
</svg>

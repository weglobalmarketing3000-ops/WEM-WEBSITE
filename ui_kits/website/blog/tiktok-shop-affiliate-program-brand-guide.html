{"@type":"Question","name":"How does TikTok Shop's affiliate program work for brands?","acceptedAnswer":{"@type":"Answer","text":"Brands set a commission rate for their products on TikTok Shop. Creators (affiliates) can then promote those products through videos and live streams. When a viewer buys through a creator's affiliate link, the creator earns the commission and the brand gets the sale. Brands can run open collaborations (any creator can join) or targeted collaborations (invite specific creators)."}},
{"@type":"Question","name":"What commission rate should brands offer on TikTok Shop?","acceptedAnswer":{"@type":"Answer","text":"Commission rates typically range from 10-20% depending on category and product margins. The U.S. average is around 13%. Higher commission rates attract more creators but reduce margins. Start at a competitive rate for your category, then adjust based on creator response and conversion data."}},
{"@type":"Question","name":"What is the difference between open and targeted collaboration on TikTok Shop?","acceptedAnswer":{"@type":"Answer","text":"Open collaboration makes your products available to any creator on TikTok Shop who wants to promote them. Targeted collaboration lets you invite specific creators directly, often with a different commission rate or exclusive terms. Most brands use both: open collaboration for volume and targeted collaboration for high-value creator relationships."}}

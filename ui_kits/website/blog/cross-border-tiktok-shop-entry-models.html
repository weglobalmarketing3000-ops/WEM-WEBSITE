    <h1>中国品牌入驻美国 TikTok Shop：POP、ACCU、全托管、品牌托管怎么选</h1>
    <p style="font-size:18px;line-height:1.7;color:#ddd;">中国品牌和厂家出海美国 TikTok Shop，第一步不是马上找达人，而是先选对入驻路径。WEM 按 TikTok Shop Global Selling 官方页面整理了四种美区相关路径。</p>
    <img src="hero-cross-border-tiktok-shop-entry-models.png" alt="POP、ACCU、全托管三种 TikTok Shop 美国市场入驻路径对比信息图" style="width:100%;height:auto;border-radius:16px;border:1px solid rgba(255,255,255,.12);margin:24px 0 28px;display:block;">
    <ul style="line-height:1.75;color:#ddd;padding-left:22px;">
      <li>POP 中国/香港主体：需要美国本地仓储物流和本地发货。</li>
      <li>POP 美国主体 ACCU：美国注册企业，最终受益人包含中国人。</li>
      <li>全托管：更适合供应链和工厂型商家。</li>
      <li>品牌托管：当前为定向邀请，更适合已有电商体量或跨境经验的品牌。</li>
    </ul>
    <h2 style="color:#ff1493;">POP 中国/香港主体</h2>
    <p style="line-height:1.7;color:#ddd;">官方页面显示，美区 POP 中国主体入驻需要合法中国内地或中国香港营业执照、美国本地仓储物流能力、美国本地发货、产品符合出口和平台治理要求，并拥有第三方电商平台运营经验。普通商家需要准备营业执照原件照片、法人证件、唯一手机号码、唯一邮箱地址，以及可选的第三方平台经验证明。官方页面显示该路径每个店铺需缴纳 1500 美金保证金。</p>
    <h2 style="color:#ff1493;">美国主体 ACCU</h2>
    <p style="line-height:1.7;color:#ddd;">美国主体跨境商家路径要求美国注册企业，且企业最终受益人包含中国人。材料包括美国本地手机号、唯一邮箱、美国公司注册文件、中国最终受益人证件、主要联系人证件和可选第三方电商经验证明；平台可能额外要求 IRS Letter 或美国主要联系人地址证明。官方页面当前在 ACCU/美国主体跨境 POP 路径下显示暂不缴纳店铺保证金。</p>
    <h2 style="color:#ff1493;">全托管和品牌托管</h2>
    <p style="line-height:1.7;color:#ddd;">全托管更适合有供应链资源、跨境供货经验或想向跨境供货的中国内地企业、个体工商户和中国香港企业。品牌托管更适合国内电商平台头部商家，或具备独立站/跨境电商运营经验的商家；官方页面显示品牌托管当前为定向邀请，需要运营经理邀请码。全托管和品牌托管官方页面显示保证金均为人民币 1000 元。</p>
    <h2 style="color:#ff1493;">WEM 的判断</h2>
    <p style="line-height:1.7;color:#ddd;">WE Marketing / WEM 会先看主体、履约、货盘、品类、价格带、内容资产和美国本地运营能力，再判断品牌适合 POP、ACCU、全托管还是品牌托管。选模式会影响后续商品页、达人寄样、UGC、直播、广告素材和每周复盘。</p>
    <p style="line-height:1.7;color:#ddd;">Source: TikTok Shop Global Selling official Chinese entry page, checked on May 28, 2026.</p>

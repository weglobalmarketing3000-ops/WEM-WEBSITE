<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">TikTok Shop Auto-post control loop</title>
  <desc id="desc">Seven-step operating loop for TikTok Shop Auto-post review and scaling.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="#050505"/>
  <text x="70" y="80" fill="#ff1493" font-family="Arial Black, Arial, sans-serif" font-size="42">AUTO-POST CONTROL LOOP</text>
  <text x="70" y="120" fill="#fff" opacity=".72" font-family="Arial, sans-serif" font-size="20">Use AIGC as a review-and-scale system, not a passive switch.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 180)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#ff1493" stroke-opacity=".45"/><text x="24" y="42" fill="#ff1493" font-size="16" font-weight="700">01 SELECT SKU POOL</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Live, clear, in-stock hero products</text></g>
    <g transform="translate(445 180)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#20f6ff" stroke-opacity=".45"/><text x="24" y="42" fill="#20f6ff" font-size="16" font-weight="700">02 CLEAN PDP ASSETS</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Images, titles, offers, claims</text></g>
    <g transform="translate(820 180)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#ff1493" stroke-opacity=".45"/><text x="24" y="42" fill="#ff1493" font-size="16" font-weight="700">03 AUTHORIZE ACCOUNTS</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Official + marketing accounts</text></g>
    <g transform="translate(70 335)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#20f6ff" stroke-opacity=".45"/><text x="24" y="42" fill="#20f6ff" font-size="16" font-weight="700">04 REVIEW SCHEDULED POSTS</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Preview before auto-publish</text></g>
    <g transform="translate(445 335)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#ff1493" stroke-opacity=".45"/><text x="24" y="42" fill="#ff1493" font-size="16" font-weight="700">05 HIDE / CANCEL / APPROVE</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Protect brand and buyer trust</text></g>
    <g transform="translate(820 335)"><rect width="310" height="105" rx="16" fill="url(#card)" stroke="#20f6ff" stroke-opacity=".45"/><text x="24" y="42" fill="#20f6ff" font-size="16" font-weight="700">06 TRACK VV + GMV</text><text x="24" y="75" fill="#fff" opacity=".78" font-size="18">Read product and content signals</text></g>
    <g transform="translate(300 500)"><rect width="600" height="105" rx="16" fill="url(#card)" stroke="#ff1493" stroke-opacity=".45"/><text x="28" y="42" fill="#ff1493" font-size="16" font-weight="700">07 SCALE WINNERS</text><text x="28" y="75" fill="#fff" opacity=".78" font-size="18">Feed creators, live scripts, paid amplification, and retargeting</text></g>
  </g>
</svg>

    <g transform="translate(325 250)"><rect width="230" height="235" rx="28" fill="#fff"/><circle cx="115" cy="70" r="40" fill="#efe6ff"/><path d="M88 53h54v38H88zM98 44h34l10 9H88z" fill="none" stroke="#8057c7" stroke-width="7"/><text x="115" y="143" text-anchor="middle" font-size="24" font-weight="800">完成首单</text><text x="115" y="177" text-anchor="middle" font-size="17" fill="#625d66">Offer 与商品页</text><text x="115" y="202" text-anchor="middle" font-size="17" fill="#625d66">履约准备</text></g>
    <g transform="translate(585 250)"><rect width="230" height="235" rx="28" fill="#fff"/><circle cx="115" cy="70" r="40" fill="#dcf3f1"/><path d="M88 48h54v39H88zM88 48l27 22 27-22" fill="none" stroke="#26968f" stroke-width="7"/><text x="115" y="143" text-anchor="middle" font-size="24" font-weight="800">帮助用好</text><text x="115" y="177" text-anchor="middle" font-size="17" fill="#625d66">使用教育</text><text x="115" y="202" text-anchor="middle" font-size="17" fill="#625d66">客户支持</text></g>

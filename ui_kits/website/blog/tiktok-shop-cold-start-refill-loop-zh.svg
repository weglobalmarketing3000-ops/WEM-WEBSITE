<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">WEM 从冷启动到补货的运营闭环</title>
  <desc id="desc">五个阶段连接 Hero SKU 和达人承诺、首单、用户教育、补货时间与复购学习。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf7"/><stop offset="1" stop-color="#f2efff"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff477e"/><stop offset=".52" stop-color="#8a63d2"/><stop offset="1" stop-color="#35a8a0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2e2438" flood-opacity=".11"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a63d2"/></marker></defs>
  <rect width="1400" height="760" rx="38" fill="url(#bg)"/><text x="70" y="88" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#e71f75" letter-spacing="2">WEM 运营框架</text><text x="70" y="145" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#171717">冷启动要为补货创造条件</text>

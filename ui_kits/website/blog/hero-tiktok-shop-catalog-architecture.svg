<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Catalog architecture is a customer decision</title><desc id="desc">Choose the structure that matches how the customer needs to buy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12111d"/><stop offset="1" stop-color="#31214d"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff4fa3"/><stop offset="1" stop-color="#b688ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="960" fill="url(#bg)"/><circle cx="1430" cy="110" r="230" fill="#ff4fa3" opacity=".12"/><circle cx="150" cy="850" r="280" fill="#9a6cff" opacity=".12"/>
  <text x="92" y="112" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#ff93c7">WE MARKETING · TIKTOK SHOP US</text>
  <text x="92" y="185" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Catalog architecture is a customer decision</text>
  <text x="92" y="230" font-family="Arial,sans-serif" font-size="25" fill="#ded6e8">Choose the structure that matches how the customer needs to buy.</text>
  <g filter="url(#shadow)"><rect x="92" y="340" width="410" height="250" rx="28" fill="#211d31" stroke="#ff74b4" stroke-opacity=".55"/><text x="124" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff74b4">CHOICE</text><text x="124" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Combined Listings</text><text x="124" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Let shoppers compare close variants.</text></g><g filter="url(#shadow)"><rect x="595" y="340" width="410" height="250" rx="28" fill="#211d31" stroke="#b68cff" stroke-opacity=".55"/><text x="627" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#b68cff">BASKET</text><text x="627" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Virtual Bundles</text><text x="627" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Make a multi-product purchase clear.</text></g><g filter="url(#shadow)"><rect x="1098" y="340" width="410" height="250" rx="28" fill="#211d31" stroke="#68d8c5" stroke-opacity=".55"/><text x="1130" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#68d8c5">REPEAT</text><text x="1130" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Subscriptions</text><text x="1130" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Support a predictable replenishment.</text></g><path d="M505 465 L575 465" stroke="url(#pink)" stroke-width="8" stroke-linecap="round"/><path d="M557 447 L575 465 L557 483" fill="none" stroke="#d7a4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1008 465 L1078 465" stroke="url(#pink)" stroke-width="8" stroke-linecap="round"/><path d="M1060 447 L1078 465 L1060 483" fill="none" stroke="#d7a4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="760" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">The structure is not a promotion. It sets product identity, inventory, fulfillment and creator-link rules.</text>
</svg>
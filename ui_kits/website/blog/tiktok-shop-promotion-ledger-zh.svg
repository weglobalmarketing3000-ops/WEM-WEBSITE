</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">一张 Promotion Ledger，一个最终价格</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">让电商、CRM、达人、LIVE、Campaign 和财务共用同一份证据。</text><g filter="url(#shadow)"><rect x="90" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="118" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">范围</text><text x="118" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">SKU + Channel</text><text x="118" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">准确 ID 与前台</text></g><g filter="url(#shadow)"><rect x="460" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#6667e1" stroke-width="3"/><text x="488" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6667e1">控制</text><text x="488" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">时间 + 库存</text><text x="488" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">开始、结束、上限</text></g><g filter="url(#shadow)"><rect x="830" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#9d62d5" stroke-width="3"/><text x="858" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#9d62d5">ECONOMICS</text><text x="858" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">价格 + 出资</text><text x="858" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">底线与付款方</text></g><g filter="url(#shadow)"><rect x="1200" y="315" width="310" height="230" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1228" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">责任</text><text x="1228" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Owner + Evidence</text><text x="1228" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Simulator 与结算</text></g><path d="M400 430L445 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M429 414L445 430L429 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 430L815 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M799 414L815 430L799 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1140 430L1185 430" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1169 414L1185 430L1169 446" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="700" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">未确认的平台出资，不计入 Base Forecast。</text></svg>
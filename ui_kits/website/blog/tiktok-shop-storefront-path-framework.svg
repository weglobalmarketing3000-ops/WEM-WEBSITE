<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Use PATH to guide the storefront journey</title><desc id="desc">Pick one arrival context, assign each module a job, tie the path to product truth, and hold the version to evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs><rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Use PATH to guide the storefront journey</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Pick one arrival context, assign each module a job, tie the path to product truth, and hold the version to evidence.</text><g filter="url(#shadow)"><rect x="55" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="81" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#3168e8">PICK</text><text x="81" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Arrival context</text><text x="81" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">creator · search · return</text></g><g filter="url(#shadow)"><rect x="355" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#4f66df" stroke-width="3"/><text x="381" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#4f66df">ASSIGN</text><text x="381" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Module job</text><text x="381" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">orient · prove · compare</text></g><g filter="url(#shadow)"><rect x="655" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#765fd8" stroke-width="3"/><text x="681" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#765fd8">TIE</text><text x="681" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Product truth</text><text x="681" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">listing · price · stock</text></g><g filter="url(#shadow)"><rect x="955" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#a160d1" stroke-width="3"/><text x="981" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#a160d1">HOLD</text><text x="981" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Version evidence</text><text x="981" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">PV · CTR · conversion</text></g><g filter="url(#shadow)"><rect x="1255" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1281" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#ed63a8">DECIDE</text><text x="1281" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Next change</text><text x="1281" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">keep · move · remove</text></g><rect x="140" y="675" width="1320" height="94" rx="24" fill="#171521"/><text x="205" y="734" font-family="Arial,sans-serif" font-size="27" fill="#fff">Give every module one shopper job, then verify the live path.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sample seeding funnel</title>
  <desc id="desc">A sample seeding funnel from creator matching through content and reuse.</desc>
  <rect width="1200" height="675" fill="#070707"/>
  <text x="72" y="86" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Sample Seeding Funnel</text>
  <text x="72" y="122" fill="#FF1493" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Samples start the content production workflow</text>
  <g transform="translate(120 178)" font-family="Inter, Arial, sans-serif">
    <g fill="#101010" stroke="rgba(255,255,255,.14)">
      <rect x="0" y="0" width="960" height="86" rx="18"/><rect x="80" y="110" width="800" height="86" rx="18"/>
      <rect x="160" y="220" width="640" height="86" rx="18"/><rect x="240" y="330" width="480" height="86" rx="18"/>
    </g>
    <g fill="#FF1493" font-size="24" font-weight="900">
      <text x="32" y="54">01</text><text x="112" y="164">02</text><text x="192" y="274">03</text><text x="272" y="384">04</text>
    </g>
    <g fill="#fff" font-size="22" font-weight="800">
      <text x="90" y="40">Match creators to product proof</text><text x="170" y="150">Approve samples with intent</text>
      <text x="250" y="260">Follow up until content posts</text><text x="330" y="370">Reuse winning content</text>
    </g>
    <g fill="rgba(255,255,255,.62)" font-size="14">
      <text x="90" y="64">Category, audience, content quality, posting habits</text><text x="170" y="174">Approve based on fit and execution likelihood</text>
      <text x="250" y="284">Shipping, reminders, briefs, questions, timing</text><text x="330" y="394">Editing, ads, product-page assets, review</text>
    </g>
    <path d="M480 92 v18 M480 202 v18 M480 312 v18" stroke="#FF1493" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

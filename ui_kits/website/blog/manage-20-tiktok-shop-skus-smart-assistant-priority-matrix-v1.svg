<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="34" fill="#f6f3ff"/><text x="72" y="80" fill="#211c40" font-family="Arial" font-size="38" font-weight="800">SKU PRIORITY = VALUE × CONFIDENCE</text><line x1="220" y1="590" x2="1270" y2="590" stroke="#49407e" stroke-width="5"/><line x1="220" y1="590" x2="220" y2="145" stroke="#49407e" stroke-width="5"/><text x="220" y="640" fill="#57516e" font-family="Arial" font-size="18">LOW VALUE</text><text x="1135" y="640" fill="#57516e" font-family="Arial" font-size="18">HIGH VALUE</text><text x="95" y="570" fill="#57516e" font-family="Arial" font-size="18">LOW CONFIDENCE</text><text x="95" y="170" fill="#57516e" font-family="Arial" font-size="18">HIGH CONFIDENCE</text><g><rect x="290" y="195" width="330" height="150" rx="26" fill="#5d54d7"/><text x="318" y="253" fill="#fff" font-family="Arial" font-size="27" font-weight="800">DO NOW</text><text x="318" y="293" fill="#fff" font-family="Arial" font-size="18">Owned bounded action</text></g><g><rect x="840" y="195" width="330" height="150" rx="26" fill="#7f6de4"/><text x="868" y="253" fill="#fff" font-family="Arial" font-size="27" font-weight="800">PROVE FIRST</text><text x="868" y="293" fill="#fff" font-family="Arial" font-size="18">Resolve the key unknown</text></g><g><rect x="290" y="405" width="330" height="150" rx="26" fill="#8a83b8"/><text x="318" y="463" fill="#fff" font-family="Arial" font-size="27" font-weight="800">MONITOR</text><text x="318" y="503" fill="#fff" font-family="Arial" font-size="18">Wait for a threshold</text></g><g><rect x="840" y="405" width="330" height="150" rx="26" fill="#514b6b"/><text x="868" y="463" fill="#fff" font-family="Arial" font-size="27" font-weight="800">PARK</text><text x="868" y="503" fill="#fff" font-family="Arial" font-size="18">No current action</text></g><text x="72" y="712" fill="#6b6480" font-family="Arial" font-size="18">Urgency and risk can raise the queue position, but never replace evidence.</text></svg>
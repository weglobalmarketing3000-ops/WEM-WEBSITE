<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">达人流量转化闭环</title>
  <desc id="desc">展示达人内容、商品页、优惠 测试和复盘的闭环。</desc>
  <rect width="1200" height="675" fill="#070707"/>
  <text x="72" y="86" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">达人流量 → 转化闭环</text>
  <text x="72" y="122" fill="#FF1493" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">流量不是终点，转化复盘才是增长系统</text>
  <g transform="translate(190 178)" font-family="Inter, Arial, sans-serif">
    <circle cx="410" cy="205" r="188" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="28"/>
    <path d="M410 17 A188 188 0 0 1 598 205" fill="none" stroke="#FF1493" stroke-width="28" stroke-linecap="round"/>
    <path d="M598 205 A188 188 0 0 1 410 393" fill="none" stroke="#9B30FF" stroke-width="28" stroke-linecap="round"/>
    <path d="M410 393 A188 188 0 0 1 222 205" fill="none" stroke="#00E5FF" stroke-width="28" stroke-linecap="round"/>
    <path d="M222 205 A188 188 0 0 1 410 17" fill="none" stroke="#FF1493" stroke-width="28" stroke-linecap="round" opacity=".55"/>
    <g fill="#101010" stroke="rgba(255,255,255,.16)">
      <rect x="-80" y="64" width="230" height="104" rx="18"/><rect x="670" y="64" width="230" height="104" rx="18"/>
      <rect x="670" y="250" width="230" height="104" rx="18"/><rect x="-80" y="250" width="230" height="104" rx="18"/>
    </g>
    <g fill="#fff" font-size="18" font-weight="900">
      <text x="-46" y="106">达人内容</text><text x="704" y="106">商品页</text><text x="704" y="292">优惠测试</text><text x="-46" y="292">每周复盘</text>
    </g>
    <g fill="rgba(255,255,255,.64)" font-size="13">
      <text x="-46" y="132">开头、展示、信任</text><text x="704" y="132">标题、图片、常见问题</text><text x="704" y="318">组合、价格、物流</text><text x="-46" y="318">销售、内容、卡点</text>
    </g>
    <text x="342" y="197" fill="#fff" font-size="26" font-weight="900">持续优化</text>
    <text x="320" y="230" fill="#FF1493" font-size="16" font-weight="800">内容 + 商品页 + 优惠</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">WEM TikTok Shop recognition trust loop</title><desc id="d">Five-step weekly operating loop: verify identity, prove product, activate creators, deliver experience, review evidence.</desc><rect width="1400" height="760" fill="#f8f6f1"/><text x="90" y="90" font-family="Arial" font-size="26" font-weight="700" fill="#e81583">WEM OPERATING FRAMEWORK</text><text x="90" y="145" font-family="Arial" font-size="46" font-weight="700" fill="#17213b">The recognition trust loop</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#1746b8" stroke-width="4"><rect x="80" y="260" width="220" height="170" rx="22"/><rect x="340" y="260" width="220" height="170" rx="22"/><rect x="600" y="260" width="220" height="170" rx="22"/><rect x="860" y="260" width="220" height="170" rx="22"/><rect x="1120" y="260" width="220" height="170" rx="22"/></g><g fill="#1746b8" font-size="22" font-weight="700"><text x="190" y="325">1. VERIFY</text><text x="450" y="325">2. PROVE</text><text x="710" y="325">3. ACTIVATE</text><text x="970" y="325">4. DELIVER</text><text x="1230" y="325">5. REVIEW</text></g><g fill="#3b3733" font-size="19"><text x="190" y="370">Identity and</text><text x="190" y="398">eligibility</text><text x="450" y="370">Product page</text><text x="450" y="398">and assortment</text><text x="710" y="370">Matched creator</text><text x="710" y="398">community</text><text x="970" y="370">Fulfillment and</text><text x="970" y="398">service</text><text x="1230" y="370">Weekly evidence</text><text x="1230" y="398">and next action</text></g></g><g stroke="#e81583" stroke-width="6" fill="none"><path d="M300 345h40"/><path d="M560 345h40"/><path d="M820 345h40"/><path d="M1080 345h40"/><path d="M1230 450v100H190V450"/></g><text x="700" y="625" font-family="Arial" text-anchor="middle" font-size="25" fill="#17213b">Recognition becomes useful when the same product truth survives the whole loop.</text></svg>

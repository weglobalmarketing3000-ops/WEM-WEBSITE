<title id="t">WEM TikTok Shop LIVE auction readiness loop</title><desc id="d">Six-step operating loop from product fit and eligibility through listing truth, live control, exact fulfillment, and weekly review.</desc>
<rect width="1400" height="760" rx="36" fill="#fbfaff"/><text x="72" y="92" font-family="Arial" font-weight="800" font-size="42" fill="#151136">WEM LIVE AUCTION READINESS LOOP</text><text x="72" y="137" font-family="Arial" font-size="23" fill="#5a5574">Earn the right to start the countdown by proving the full system.</text>
<g font-family="Arial" text-anchor="middle"><circle cx="700" cy="390" r="118" fill="#28185f"/><text x="700" y="376" font-weight="800" font-size="34" fill="#fff">COUNTDOWN</text><text x="700" y="418" font-size="24" fill="#d9d2ff">comes last</text>
<g font-size="24" font-weight="700" fill="#17133a">
<rect x="80" y="220" width="300" height="132" rx="28" fill="#eee9ff"/><text x="230" y="280">1 · PRODUCT FIT</text><text x="230" y="318" font-size="18" font-weight="400">Real reason to bid</text>
<rect x="80" y="454" width="300" height="132" rx="28" fill="#e1f6f4"/><text x="230" y="514">2 · ELIGIBILITY</text><text x="230" y="552" font-size="18" font-weight="400">Seller + creator access</text>
<rect x="550" y="585" width="300" height="112" rx="28" fill="#fff0e9"/><text x="700" y="637">3 · LISTING TRUTH</text><text x="700" y="671" font-size="18" font-weight="400">Screen = listing = package</text>
<rect x="1020" y="454" width="300" height="132" rx="28" fill="#eee9ff"/><text x="1170" y="514">4 · LIVE CONTROL</text><text x="1170" y="552" font-size="18" font-weight="400">Host + moderator + operator</text>
<rect x="1020" y="220" width="300" height="132" rx="28" fill="#e1f6f4"/><text x="1170" y="280">5 · FULFILL EXACTLY</text><text x="1170" y="318" font-size="18" font-weight="400">Winner mapped to item</text>
<rect x="550" y="92" width="300" height="112" rx="28" fill="#fff0e9"/><text x="700" y="144">6 · REVIEW WEEKLY</text><text x="700" y="178" font-size="18" font-weight="400">Questions, errors, disputes</text></g></g>

<title id="title">Match the deal to the evidence</title><desc id="desc">Commission and flat fee are payment structures. Exclusive Collaboration is an invite-only program.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Match the deal to the evidence</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Commission and flat fee are payment structures. Exclusive Collaboration is an invite-only program.</text><g filter="url(#shadow)"><rect x="75" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">DISCOVERY</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Commission first</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Low proof · optional post</text></g><g filter="url(#shadow)"><rect x="585" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="613" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">PRODUCTION</text><text x="613" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Flat fee + upside</text><text x="613" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Strong fit · defined video</text></g><g filter="url(#shadow)"><rect x="1095" y="315" width="430" height="250" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1123" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">RELATIONSHIP</text><text x="1123" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Program or agreement</text><text x="1123" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Proven fit · exact terms</text></g><rect x="110" y="675" width="1380" height="92" rx="24" fill="#171521"/><text x="160" y="733" font-family="Arial,sans-serif" font-size="27" fill="#fff">Start with the collaboration job, then decide how risk and reward are shared.</text></svg>
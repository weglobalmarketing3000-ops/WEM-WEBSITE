<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">A controlled 14-day activation</title><desc id="desc">Hold settings long enough to learn, then choose scale, repair, hold or stop.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">A controlled 14-day activation</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Hold settings long enough to learn, then choose scale, repair, hold or stop.</text><g filter="url(#shadow)"><rect x="90" y="315" width="400" height="245" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="118" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">BEFORE LAUNCH</text><text x="118" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Baseline + controls</text><text x="118" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Scope · margin · inventory</text></g><g filter="url(#shadow)"><rect x="600" y="315" width="400" height="245" rx="26" fill="#fff" stroke="#7c66dc" stroke-width="3"/><text x="628" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#7c66dc">DAYS 1–7</text><text x="628" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Stabilize inputs</text><text x="628" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Delivery · authorization · PDP</text></g><g filter="url(#shadow)"><rect x="1110" y="315" width="400" height="245" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1138" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">DAYS 8–14</text><text x="1138" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Compare outcomes</text><text x="1138" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Contribution · mix · risk</text></g><path d="M490 440L575 440" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M559 424L575 440L559 456" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000 440L1085 440" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1069 424L1085 440L1069 456" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="715" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#171521">Decision:</text><text x="285" y="715" font-family="Arial,sans-serif" font-size="27" fill="#3168e8">SCALE</text><text x="505" y="715" font-family="Arial,sans-serif" font-size="27" fill="#7664dd">REPAIR</text><text x="755" y="715" font-family="Arial,sans-serif" font-size="27" fill="#a461d2">HOLD</text><text x="960" y="715" font-family="Arial,sans-serif" font-size="27" fill="#ed63a8">STOP</text></svg>
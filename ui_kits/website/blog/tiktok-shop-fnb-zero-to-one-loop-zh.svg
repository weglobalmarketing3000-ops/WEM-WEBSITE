  <g font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">
    <g transform="translate(90 268)" filter="url(#shadow)">
      <rect width="250" height="162" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#1746b8"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">1</text>
      <text x="125" y="61" font-size="22" font-weight="800" fill="#14142b">产品事实</text>
      <text x="125" y="94" font-size="17" fill="#615e73">筛 3-5 个候选</text>
      <text x="125" y="120" font-size="17" fill="#615e73">集中 1-3 个 Hero SKU</text>
    </g>
    <g transform="translate(380 268)" filter="url(#shadow)">
      <rect width="250" height="162" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#4c62d6"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">2</text>
      <text x="125" y="61" font-size="22" font-weight="800" fill="#14142b">达人匹配</text>
      <text x="125" y="94" font-size="17" fill="#615e73">产品 affinity + 受众</text>
      <text x="125" y="120" font-size="17" fill="#615e73">真实可执行角度</text>
    </g>
    <g transform="translate(670 268)" filter="url(#shadow)">
      <rect width="250" height="162" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#7b61ff"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">3</text>
      <text x="125" y="61" font-size="22" font-weight="800" fill="#14142b">内容任务</text>
      <text x="125" y="94" font-size="17" fill="#615e73">味道 · 质地 · 场景</text>
      <text x="125" y="120" font-size="17" fill="#615e73">信任 + offer</text>
    </g>
    <g transform="translate(960 268)" filter="url(#shadow)">
      <rect width="250" height="162" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#a14fdd"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">4</text>
      <text x="125" y="61" font-size="22" font-weight="800" fill="#14142b">商品页 + offer</text>
      <text x="125" y="94" font-size="17" fill="#615e73">产品讲清楚</text>
      <text x="125" y="120" font-size="17" fill="#615e73">价格 + 运费</text>
    </g>
    <g transform="translate(1058 505)" filter="url(#shadow)">
      <rect width="250" height="148" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#ed2b86"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">5</text>
      <text x="125" y="58" font-size="22" font-weight="800" fill="#14142b">GMV Max 测试</text>
      <text x="125" y="91" font-size="17" fill="#615e73">受控 spend</text>
      <text x="125" y="117" font-size="17" fill="#615e73">比较真实信号</text>
    </g>
    <g transform="translate(697 505)" filter="url(#shadow)">
      <rect width="250" height="148" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#e64b9a"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">6</text>
      <text x="125" y="58" font-size="22" font-weight="800" fill="#14142b">履约</text>
      <text x="125" y="91" font-size="17" fill="#615e73">库存 + 新鲜度</text>
      <text x="125" y="117" font-size="17" fill="#615e73">客服 + 评价</text>
    </g>
    <g transform="translate(336 505)" filter="url(#shadow)">
      <rect width="250" height="148" rx="24" fill="#fff"/>
      <circle cx="125" cy="0" r="32" fill="#925dde"/><text x="125" y="9" font-size="25" font-weight="800" fill="#fff">7</text>
      <text x="125" y="58" font-size="22" font-weight="800" fill="#14142b">下一次决定</text>
      <text x="125" y="91" font-size="17" fill="#615e73">扩大 · 修复 · 停止</text>
      <text x="125" y="117" font-size="17" fill="#615e73">再进入下一轮</text>
    </g>

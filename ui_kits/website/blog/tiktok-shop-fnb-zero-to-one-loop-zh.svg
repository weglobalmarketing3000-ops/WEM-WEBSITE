  <rect x="72" y="690" width="1256" height="2" fill="url(#line)" opacity=".45"/>
  <text x="72" y="727" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#615e73">0 → 1 不是完成所有动作，而是建立品牌能理解、重复和改进的第一套运营系统。</text>
</svg>

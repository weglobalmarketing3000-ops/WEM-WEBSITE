<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Hero SKU 四周决策周期</title>
  <desc id="desc">第一周建立候选池，第二周制造证明，第三周修复失效层，第四周决定 Scale、Repair 或 Stop。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09070c"/><stop offset="1" stop-color="#17121d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff2ba6"/><stop offset=".5" stop-color="#9a5cff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <style>
      .k{font:700 18px "Noto Sans SC","PingFang SC",Arial,sans-serif;letter-spacing:2px;fill:#ff65c2}.h{font:900 44px "Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#fff}
      .sub{font:400 22px "Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#c9c1cf}.week{font:800 17px Arial,sans-serif;letter-spacing:1px;fill:#ff8ad0}
      .label{font:800 27px "Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#fff}.body{font:400 18px "Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#c3b9c9}
      .out{font:900 20px Arial,sans-serif;fill:#09070c}.small{font:600 16px "Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#d7cfdd}
    </style>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <text x="76" y="76" class="k">受控冷启动，清楚退出规则</text>
  <text x="76" y="135" class="h">Hero SKU 四周决策周期</text>
  <text x="76" y="176" class="sub">把搜索信号变成有 owner、有证据标准、有复盘日期的测试。</text>
  <rect x="82" y="281" width="1236" height="8" rx="4" fill="url(#line)"/>
  <g transform="translate(72 225)">
    <circle cx="85" cy="60" r="30" fill="#ff2ba6"/><text x="75" y="68" class="out">1</text>
    <rect y="105" width="260" height="246" rx="24" fill="#17131b" stroke="#ff2ba6"/>
    <text x="26" y="143" class="week">WEEK 1</text><text x="26" y="181" class="label">建立候选池</text>
    <text x="26" y="220" class="body"><tspan x="26">准确匹配需求。</tspan><tspan x="26" dy="29">筛选证明、达人 fit、</tspan><tspan x="26" dy="29">利润、库存和风险。</tspan></text>
    <text x="26" y="320" class="small">产出：1 至 3 个候选品</text>
  </g>
  <g transform="translate(402 225)">
    <circle cx="85" cy="60" r="30" fill="#ce48e8"/><text x="75" y="68" class="out">2</text>
    <rect y="105" width="260" height="246" rx="24" fill="#17131b" stroke="#ce48e8"/>
    <text x="26" y="143" class="week">WEEK 2</text><text x="26" y="181" class="label">制造证明</text>
    <text x="26" y="220" class="body"><tspan x="26">激活不同达人 cohort。</tspan><tspan x="26" dy="29">测试不同 proof job。</tspan><tspan x="26" dy="29">收集消费者问题。</tspan></text>
    <text x="26" y="320" class="small">产出：按路径拆分的证据</text>
  </g>
  <g transform="translate(732 225)">
    <circle cx="85" cy="60" r="30" fill="#8b5cf6"/><text x="75" y="68" class="out">3</text>
    <rect y="105" width="260" height="246" rx="24" fill="#17131b" stroke="#8b5cf6"/>
    <text x="26" y="143" class="week">WEEK 3</text><text x="26" y="181" class="label">修复一层</text>
    <text x="26" y="220" class="body"><tspan x="26">定位具体限制。</tspan><tspan x="26" dy="29">指定 owner 和动作。</tspan><tspan x="26" dy="29">增加流量前先复测。</tspan></text>
    <text x="26" y="320" class="small">产出：有 owner 的修复</text>
  </g>
  <g transform="translate(1062 225)">
    <circle cx="85" cy="60" r="30" fill="#38bdf8"/><text x="75" y="68" class="out">4</text>
    <rect y="105" width="266" height="246" rx="24" fill="#17131b" stroke="#38bdf8"/>
    <text x="26" y="143" class="week">WEEK 4</text><text x="26" y="181" class="label">做决定</text>
    <rect x="26" y="218" width="70" height="34" rx="17" fill="#22c55e"/><text x="38" y="241" class="out">Scale</text>
    <rect x="104" y="218" width="77" height="34" rx="17" fill="#f59e0b"/><text x="114" y="241" class="out">Repair</text>
    <rect x="189" y="218" width="56" height="34" rx="17" fill="#f43f5e"/><text x="200" y="241" class="out">Stop</text>
    <text x="26" y="295" class="body"><tspan x="26">只有整个系统可以重复，</tspan><tspan x="26" dy="27">才集中更多资源。</tspan></text>
  </g>
  <rect x="80" y="640" width="1240" height="56" rx="18" fill="#100d14" stroke="#382d41"/>
  <text x="108" y="676" class="small">每个测试都要有进入理由、退出理由，以及能改变下一次选品决定的证据。</text>
</svg>

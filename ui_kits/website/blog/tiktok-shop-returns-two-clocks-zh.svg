<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">用两个 Clock 管理 Returns</title><desc id="desc">先解决当前 Customer，再防止下一次 Avoidable Return。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs><rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">用两个 Clock 管理 Returns</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">先解决当前 Customer，再防止下一次 Avoidable Return。</text><g filter="url(#shadow)"><rect x="80" y="315" width="310" height="245" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="106" y="357" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#3168e8">SIGNAL</text><text x="106" y="404" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Read VoC</text><text x="106" y="447" font-family="Arial,sans-serif" font-size="18" fill="#625c70">Range · Issue · Trend</text></g><g filter="url(#shadow)"><rect x="460" y="315" width="310" height="245" rx="26" fill="#fff" stroke="#765fd8" stroke-width="3"/><text x="486" y="357" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#765fd8">CAUSE</text><text x="486" y="404" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Assign Owner</text><text x="486" y="447" font-family="Arial,sans-serif" font-size="18" fill="#625c70">Product · Service</text></g><g filter="url(#shadow)"><rect x="840" y="315" width="310" height="245" rx="26" fill="#fff" stroke="#a160d1" stroke-width="3"/><text x="866" y="357" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#a160d1">ACTION</text><text x="866" y="404" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Fix or Test</text><text x="866" y="447" font-family="Arial,sans-serif" font-size="18" fill="#625c70">Operation · Content</text></g><g filter="url(#shadow)"><rect x="1220" y="315" width="310" height="245" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1246" y="357" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#ed63a8">READBACK</text><text x="1246" y="404" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Keep or Repair</text><text x="1246" y="447" font-family="Arial,sans-serif" font-size="18" fill="#625c70">Review · Return · CVR</text></g><path d="M390 438L450 438" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M435 423L450 438L435 453" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 438L830 438" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M815 423L830 438L815 453" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1150 438L1210 438" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M1195 423L1210 438L1195 453" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="680" width="1100" height="92" rx="24" fill="#171521"/><text x="340" y="737" font-family="Arial,sans-serif" font-size="27" fill="#fff">在 SLA 内关闭 Customer Case，并按 Prevention Clock 修掉 Operating Defect。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Route the issue before creating content</title><desc id="desc">Content owns an expectation gap, not every customer failure.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter></defs><rect width="1600" height="960" fill="url(#bg)"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text><text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Route the issue before creating content</text><text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Content owns an expectation gap, not every customer failure.</text><g filter="url(#shadow)"><rect x="55" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="81" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#3168e8">PRODUCT</text><text x="81" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Fix the item</text><text x="81" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">quality · design</text></g><g filter="url(#shadow)"><rect x="355" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#4f66df" stroke-width="3"/><text x="381" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#4f66df">LISTING</text><text x="381" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Fix the truth</text><text x="381" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">size · specs</text></g><g filter="url(#shadow)"><rect x="655" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#765fd8" stroke-width="3"/><text x="681" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#765fd8">FULFILLMENT</text><text x="681" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Fix delivery</text><text x="681" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">wrong · damaged</text></g><g filter="url(#shadow)"><rect x="955" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#a160d1" stroke-width="3"/><text x="981" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#a160d1">SERVICE</text><text x="981" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Fix response</text><text x="981" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">answer · resolve</text></g><g filter="url(#shadow)"><rect x="1255" y="300" width="275" height="245" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1281" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.7" fill="#ed63a8">EXPECTATION</text><text x="1281" y="389" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#171521">Create content</text><text x="1281" y="432" font-family="Arial,sans-serif" font-size="18" fill="#625c70">qualify · show</text></g><rect x="140" y="675" width="1320" height="94" rx="24" fill="#171521"/><text x="205" y="734" font-family="Arial,sans-serif" font-size="27" fill="#fff">Fix the owned cause first. Then close the remaining expectation gap.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720"><rect width="100%" height="100%" fill="#18162b"/><text x="75" y="95" font-family="Arial" font-size="50" font-weight="700" fill="white">每周毕业复盘</text><text x="75" y="140" font-family="Arial" font-size="24" fill="#c8c2ee">决定继续、收紧或暂停什么</text><g><rect x="75" y="250" width="350" height="220" rx="28" fill="#2c2850" stroke="#a998ff"/><text x="110" y="320" font-family="Arial" font-size="22" fill="#ff9ac9">1</text><text x="110" y="385" font-family="Arial" font-size="34" font-weight="700" fill="white">承接能力</text></g><g><rect x="495" y="250" width="350" height="220" rx="28" fill="#2c2850" stroke="#a998ff"/><text x="530" y="320" font-family="Arial" font-size="22" fill="#ff9ac9">2</text><text x="530" y="385" font-family="Arial" font-size="34" font-weight="700" fill="white">买家路径</text></g><g><rect x="915" y="250" width="350" height="220" rx="28" fill="#2c2850" stroke="#a998ff"/><text x="950" y="320" font-family="Arial" font-size="22" fill="#ff9ac9">3</text><text x="950" y="385" font-family="Arial" font-size="34" font-weight="700" fill="white">经营决定</text></g></svg>
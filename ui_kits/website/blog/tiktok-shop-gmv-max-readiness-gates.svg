<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Five gates before Product GMV Max</title><desc id="desc">A product is test-ready when every gate has evidence, an owner and a stop condition.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Five gates before Product GMV Max</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">A product is test-ready when every gate has evidence, an owner and a stop condition.</text><g filter="url(#shadow)"><rect x="75" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">01</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Product truth</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Listing + promise</text></g><g filter="url(#shadow)"><rect x="380" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#5a69e3" stroke-width="3"/><text x="408" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5a69e3">02</text><text x="408" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Contribution</text><text x="408" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">After-media floor</text></g><g filter="url(#shadow)"><rect x="685" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="713" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">03</text><text x="713" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Conversion</text><text x="713" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">PDP + checkout</text></g><g filter="url(#shadow)"><rect x="990" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#ad61d0" stroke-width="3"/><text x="1018" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ad61d0">04</text><text x="1018" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Content supply</text><text x="1018" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Authorized jobs</text></g><g filter="url(#shadow)"><rect x="1295" y="315" width="230" height="235" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1323" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">05</text><text x="1323" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">Control</text><text x="1323" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Owner + stops</text></g><rect x="75" y="655" width="1450" height="94" rx="22" fill="#171521"/><text x="115" y="714" font-family="Arial,sans-serif" font-size="27" fill="#fff">Scale a ready system. Do not automate a known problem.</text></svg>
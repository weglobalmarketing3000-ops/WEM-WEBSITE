<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">POP vs ACCU vs Fully Managed TikTok Shop U.S. entry models</title>
  <desc id="desc">Graphic blog hero comparing POP, ACCU, and fully managed models for China-based brands entering TikTok Shop U.S.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09070B"/>
      <stop offset=".48" stop-color="#120E19"/>
      <stop offset="1" stop-color="#07131A"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx=".11" cy=".1" r=".62">
      <stop offset="0" stop-color="#FF1493" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#FF1493" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx=".9" cy=".2" r=".45">
      <stop offset="0" stop-color="#4A8FFF" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#4A8FFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#4A8FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E9F"/>
      <stop offset="1" stop-color="#1CD6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { fill:#FF2E9F; font-size:22px; font-weight:700; letter-spacing:3px; }
      .title { fill:#FFFFFF; font-size:64px; font-weight:800; }
      .sub { fill:#CFCFD5; font-size:23px; font-weight:600; }
      .module-title { fill:#FFFFFF; font-size:42px; font-weight:800; }
      .module-sub { fill:#FF5BB0; font-size:18px; font-weight:700; letter-spacing:1.4px; }
      .module-copy { fill:#E9E9EE; font-size:20px; font-weight:700; }
      .small { fill:#9DA0AA; font-size:16px; font-weight:700; letter-spacing:1px; }
      .note { fill:#A8A8AD; font-size:17px; }
      .pillText { fill:#FFFFFF; font-size:18px; font-weight:700; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect width="1672" height="941" fill="url(#pinkGlow)"/>
  <rect width="1672" height="941" fill="url(#blueGlow)"/>

  <g class="sans">
    <text x="96" y="104" class="eyebrow">TIKTOK SHOP U.S. · ENTRY MODEL GUIDE</text>
    <text x="96" y="184" class="title">POP vs ACCU vs Fully Managed</text>
    <text x="96" y="256" class="title">Choose the model before the launch plan</text>
    <text x="96" y="314" class="sub">Entity structure, fulfillment, and operating responsibility decide which path actually fits.</text>

    <rect x="96" y="354" width="196" height="42" rx="21" fill="#101117" stroke="#262734"/>
    <text x="126" y="381" class="pillText">Entity</text>
    <rect x="308" y="354" width="196" height="42" rx="21" fill="#101117" stroke="#262734"/>
    <text x="338" y="381" class="pillText">Fulfillment</text>
    <rect x="520" y="354" width="232" height="42" rx="21" fill="#101117" stroke="#262734"/>
    <text x="550" y="381" class="pillText">Responsibility</text>

    <g filter="url(#shadow)">
      <rect x="96" y="445" width="444" height="330" rx="34" fill="#0B0C11" stroke="#262833"/>
      <rect x="614" y="445" width="444" height="330" rx="34" fill="#0B0C11" stroke="#262833"/>
      <rect x="1132" y="445" width="444" height="330" rx="34" fill="#0B0C11" stroke="#262833"/>
    </g>

    <rect x="96" y="445" width="444" height="12" rx="6" fill="url(#accent)"/>
    <rect x="614" y="445" width="444" height="12" rx="6" fill="url(#accent)"/>
    <rect x="1132" y="445" width="444" height="12" rx="6" fill="url(#accent)"/>

    <g transform="translate(130 486)">
      <circle cx="44" cy="42" r="42" fill="#15131A" stroke="#323546"/>
      <rect x="20" y="24" width="48" height="34" rx="8" fill="none" stroke="#FF4AAA" stroke-width="4"/>
      <path d="M28 66 L60 66" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 18 L54 18" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <text x="104" y="22" class="module-sub">SELF-OPERATED</text>
      <text x="104" y="72" class="module-title">POP</text>
      <text x="104" y="108" class="module-copy">China or Hong Kong entity</text>
      <text x="0" y="170" class="small">Best for</text>
      <text x="0" y="202" class="module-copy">Teams with a CN/HK entity</text>
      <text x="0" y="234" class="module-copy">and U.S. local fulfillment</text>
      <text x="0" y="282" class="small">Keywords</text>
      <text x="0" y="314" class="module-copy">Local warehouse · Self-run · $1,500</text>
    </g>

    <g transform="translate(648 486)">
      <circle cx="44" cy="42" r="42" fill="#15131A" stroke="#323546"/>
      <rect x="24" y="18" width="40" height="48" rx="8" fill="none" stroke="#FF4AAA" stroke-width="4"/>
      <path d="M34 30 L54 30" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 42 L54 42" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 54 L48 54" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <text x="104" y="22" class="module-sub">U.S. ENTITY POP</text>
      <text x="104" y="72" class="module-title">ACCU</text>
      <text x="104" y="108" class="module-copy">U.S. company path</text>
      <text x="0" y="170" class="small">Best for</text>
      <text x="0" y="202" class="module-copy">U.S.-registered entities</text>
      <text x="0" y="234" class="module-copy">with Chinese UBO documents</text>
      <text x="0" y="282" class="small">Keywords</text>
      <text x="0" y="314" class="module-copy">Company files · IRS review · No deposit shown</text>
    </g>

    <g transform="translate(1166 486)">
      <circle cx="44" cy="42" r="42" fill="#15131A" stroke="#323546"/>
      <path d="M18 58 L30 26 L46 46 L60 18 L70 58 Z" fill="none" stroke="#FF4AAA" stroke-width="4" stroke-linejoin="round"/>
      <path d="M20 62 L68 62" stroke="#1CD6FF" stroke-width="4" stroke-linecap="round"/>
      <text x="104" y="22" class="module-sub">SUPPLY-LED MODEL</text>
      <text x="104" y="72" class="module-title">Fully Managed</text>
      <text x="104" y="108" class="module-copy">Supply-side path</text>
      <text x="0" y="170" class="small">Best for</text>
      <text x="0" y="202" class="module-copy">Factories and trading teams</text>
      <text x="0" y="234" class="module-copy">with stronger supply chains</text>
      <text x="0" y="282" class="small">Keywords</text>
      <text x="0" y="314" class="module-copy">Supply-led · Managed model · RMB 1,000</text>
    </g>

    <path d="M540 612 C575 612 578 612 614 612" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
    <path d="M1058 612 C1093 612 1096 612 1132 612" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
    <polygon points="606,605 624,612 606,619" fill="#1CD6FF"/>
    <polygon points="1124,605 1142,612 1124,619" fill="#1CD6FF"/>

    <line x1="96" y1="840" x2="1576" y2="840" stroke="#1D1E24"/>
    <text x="96" y="885" class="note">Brand-managed is usually discussed separately because it is more invitation-led. Final requirements still depend on TikTok Shop Global Selling rules and review results.</text>
  </g>
</svg>

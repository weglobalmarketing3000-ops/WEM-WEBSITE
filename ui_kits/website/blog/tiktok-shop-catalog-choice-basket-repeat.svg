<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Choice · Basket · Repeat</title><desc id="desc">Use the shopper job before selecting a catalog tool.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12111d"/><stop offset="1" stop-color="#31214d"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff4fa3"/><stop offset="1" stop-color="#b688ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="960" fill="url(#bg)"/><circle cx="1430" cy="110" r="230" fill="#ff4fa3" opacity=".12"/><circle cx="150" cy="850" r="280" fill="#9a6cff" opacity=".12"/>
  <text x="92" y="112" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#ff93c7">WE MARKETING · TIKTOK SHOP US</text>
  <text x="92" y="185" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Choice · Basket · Repeat</text>
  <text x="92" y="230" font-family="Arial,sans-serif" font-size="25" fill="#ded6e8">Use the shopper job before selecting a catalog tool.</text>
  <g filter="url(#shadow)"><rect x="110" y="335" width="400" height="270" rx="28" fill="#211d31" stroke="#ff74b4" stroke-opacity=".55"/><text x="142" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff74b4">1. CHOICE</text><text x="142" y="443" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Compare related items</text><text x="142" y="489" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Combined Listings</text></g><g filter="url(#shadow)"><rect x="600" y="335" width="400" height="270" rx="28" fill="#211d31" stroke="#b68cff" stroke-opacity=".55"/><text x="632" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#b68cff">2. BASKET</text><text x="632" y="443" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Buy a set together</text><text x="632" y="489" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Virtual Bundles</text></g><g filter="url(#shadow)"><rect x="1090" y="335" width="400" height="270" rx="28" fill="#211d31" stroke="#68d8c5" stroke-opacity=".55"/><text x="1122" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#68d8c5">3. REPEAT</text><text x="1122" y="443" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Reorder on a cadence</text><text x="1122" y="489" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Subscriptions</text></g><text x="110" y="740" font-family="Arial,sans-serif" font-size="30" fill="#fff">Start with customer intent. Do not use a catalog feature merely because it is available.</text>
</svg>
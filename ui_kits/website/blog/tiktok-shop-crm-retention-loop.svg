<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">WEM TikTok Shop customer retention operating loop</title>
  <desc id="desc">Six connected stages show creator discovery, first order, customer signals, relevant outreach, repeat purchase, and weekly learning.</desc>
  <rect width="1400" height="760" rx="36" fill="#fffdf9"/>
  <text x="90" y="100" fill="#171717" font-family="Arial, sans-serif" font-size="42" font-weight="800">The WEM Customer-Retention Loop</text>
  <text x="90" y="145" fill="#6f6a64" font-family="Arial, sans-serif" font-size="22">Acquisition becomes more valuable when customer behavior improves the next cycle.</text>
  <path d="M190 365 C190 230 350 210 475 250 C600 290 785 290 910 250 C1050 205 1210 245 1210 375 C1210 510 1050 545 910 505 C785 468 600 468 475 505 C340 545 190 505 190 365Z" fill="none" stroke="#ff1493" stroke-width="18" stroke-linecap="round" opacity=".2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(180 375)"><circle r="88" fill="#171717"/><text y="-10" fill="#fff" font-size="24" font-weight="700">Creator</text><text y="23" fill="#fff" font-size="24" font-weight="700">discovery</text></g>
    <g transform="translate(390 260)"><circle r="88" fill="#ff7e9f"/><text y="-10" fill="#171717" font-size="24" font-weight="700">First</text><text y="23" fill="#171717" font-size="24" font-weight="700">order</text></g>
    <g transform="translate(650 235)"><circle r="88" fill="#bfe9e7"/><text y="-10" fill="#171717" font-size="24" font-weight="700">Customer</text><text y="23" fill="#171717" font-size="24" font-weight="700">signals</text></g>
    <g transform="translate(910 260)"><circle r="88" fill="#d9c8ff"/><text y="-10" fill="#171717" font-size="24" font-weight="700">Relevant</text><text y="23" fill="#171717" font-size="24" font-weight="700">outreach</text></g>
    <g transform="translate(1210 375)"><circle r="88" fill="#ff1493"/><text y="-10" fill="#fff" font-size="24" font-weight="700">Repeat</text><text y="23" fill="#fff" font-size="24" font-weight="700">purchase</text></g>
    <g transform="translate(650 535)"><rect x="-142" y="-58" width="284" height="116" rx="30" fill="#ffe9c9"/><text y="-8" fill="#171717" font-size="24" font-weight="700">Weekly learning</text><text y="25" fill="#554f49" font-size="17">page · brief · offer · LIVE</text></g>
  </g>
  <g fill="#ff1493"><path d="M267 320l36-7-16 34z"/><path d="M493 244l35-10-13 35z"/><path d="M751 239l35-10-13 35z"/><path d="M1010 283l36 5-25 28z"/><path d="M1122 477l-34 14 9-36z"/><path d="M501 505l-35 11 12-35z"/></g>
  <rect x="90" y="650" width="1220" height="2" fill="#e7e1d8"/>
  <text x="90" y="700" fill="#ff1493" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">WEM OPERATING FRAMEWORK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">一个 Campaign，两个 Measurement View</title><desc id="desc">混合归因用于控制 Campaign，业务 Baseline 用于判断真实影响。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3168e8"/><stop offset=".55" stop-color="#8465df"/><stop offset="1" stop-color="#ed63a8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6756a8" flood-opacity=".16"/></filter>
</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">一个 Campaign，两个 Measurement View</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">混合归因用于控制 Campaign，业务 Baseline 用于判断真实影响。</text><g filter="url(#shadow)"><rect x="140" y="315" width="540" height="290" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="168" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">CAMPAIGN CONTROL</text><text x="168" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">管理系统</text><text x="168" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Cost · Orders · Gross Revenue · ROI</text></g><g filter="url(#shadow)"><rect x="920" y="315" width="540" height="290" rx="26" fill="#fff" stroke="#a461d2" stroke-width="3"/><text x="948" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a461d2">BUSINESS IMPACT</text><text x="948" y="409" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#171521">判断结果</text><text x="948" y="452" font-family="Arial,sans-serif" font-size="19" fill="#625c70">Total GMV · Contribution · Returns</text></g><path d="M700 460L895 460" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M879 444L895 460L879 476" fill="none" stroke="#765fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="690" width="1100" height="88" rx="22" fill="#171521"/><text x="315" y="746" font-family="Arial,sans-serif" font-size="26" fill="#fff">Dashboard Attribution 不等于独立 Incrementality Study。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">TikTok Shop U.S. market signals for agency selection</title>
  <desc id="desc">A data graphic showing TikTok Shop U.S. launch in 2023, 200,000 registered sellers, 100,000 affiliate creators, and projected 2025 U.S. sales of 15.82 billion dollars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".55" stop-color="#120015"/>
      <stop offset="1" stop-color="#03010a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset=".55" stop-color="#9b30ff"/>
      <stop offset="1" stop-color="#4A8FFF"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="260" fill="#ff1493" opacity=".16" filter="url(#glow)"/>
  <circle cx="210" cy="700" r="260" fill="#4A8FFF" opacity=".10" filter="url(#glow)"/>
  <text x="72" y="84" fill="#ff1493" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">MARKET SIGNALS</text>
  <text x="72" y="142" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900">
    <tspan x="72" dy="0">Why TikTok Shop agencies became</tspan>
    <tspan x="72" dy="56">a U.S. category</tspan>
  </text>
  <text x="72" y="236" fill="rgba(255,255,255,.72)" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="72" dy="0">Fast platform adoption means brands now need creator recruitment, affiliate operations,</tspan>
    <tspan x="72" dy="30">shop strategy, and content systems.</tspan>
  </text>
  <g transform="translate(72 300)">
    <rect width="285" height="285" rx="24" fill="#0b0b0d" stroke="rgba(255,255,255,.14)"/>
    <text x="28" y="72" fill="#FF1493" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">SEPT 2023</text>
    <text x="28" y="138" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900">U.S. launch</text>
    <text x="28" y="182" fill="rgba(255,255,255,.68)" font-family="Arial, Helvetica, sans-serif" font-size="19">
      <tspan x="28" dy="0">TikTok Shop officially</tspan>
      <tspan x="28" dy="28">launches in the</tspan>
      <tspan x="28" dy="28">United States.</tspan>
    </text>
  </g>
  <g transform="translate(385 300)">
    <rect width="285" height="285" rx="24" fill="#0b0b0d" stroke="rgba(255,255,255,.14)"/>
    <text x="28" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">200K+</text>
    <text x="28" y="138" fill="#ff1493" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">registered sellers</text>
    <text x="28" y="182" fill="rgba(255,255,255,.68)" font-family="Arial, Helvetica, sans-serif" font-size="19">
      <tspan x="28" dy="0">Reported at the U.S.</tspan>
      <tspan x="28" dy="28">launch by AP.</tspan>
    </text>
  </g>
  <g transform="translate(698 300)">
    <rect width="285" height="285" rx="24" fill="#0b0b0d" stroke="rgba(255,255,255,.14)"/>
    <text x="28" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">100K+</text>
    <text x="28" y="138" fill="#4A8FFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">affiliate creators</text>
    <text x="28" y="182" fill="rgba(255,255,255,.68)" font-family="Arial, Helvetica, sans-serif" font-size="19">
      <tspan x="28" dy="0">Creators already in the</tspan>
      <tspan x="28" dy="28">affiliate program</tspan>
      <tspan x="28" dy="28">at launch.</tspan>
    </text>
  </g>
  <g transform="translate(1011 300)">
    <rect width="285" height="285" rx="24" fill="#0b0b0d" stroke="rgba(255,255,255,.14)"/>
    <text x="28" y="88" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900">$15.82B</text>
    <text x="28" y="138" fill="#9b30ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">2025 U.S. sales</text>
    <text x="28" y="182" fill="rgba(255,255,255,.68)" font-family="Arial, Helvetica, sans-serif" font-size="19">
      <tspan x="28" dy="0">eMarketer estimate for</tspan>
      <tspan x="28" dy="28">TikTok Shop U.S.</tspan>
      <tspan x="28" dy="28">sales.</tspan>
    </text>
  </g>
  <path d="M105 650 H1295" stroke="url(#hot)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="112" cy="650" r="16" fill="#FF1493"/>
  <circle cx="518" cy="650" r="16" fill="#ff1493"/>
  <circle cx="924" cy="650" r="16" fill="#4A8FFF"/>
  <circle cx="1288" cy="650" r="16" fill="#9b30ff"/>
  <text x="72" y="744" fill="rgba(255,255,255,.58)" font-family="Arial, Helvetica, sans-serif" font-size="18">Sources: TikTok Newsroom; Associated Press, Sept. 2023; eMarketer forecast cited in 2025 TikTok Shop coverage.</text>
</svg>

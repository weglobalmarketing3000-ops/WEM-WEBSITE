<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Catalog change control</title><desc id="desc">An eight-step release protects the buying experience.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12111d"/><stop offset="1" stop-color="#31214d"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff4fa3"/><stop offset="1" stop-color="#b688ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="960" fill="url(#bg)"/><circle cx="1430" cy="110" r="230" fill="#ff4fa3" opacity=".12"/><circle cx="150" cy="850" r="280" fill="#9a6cff" opacity=".12"/>
  <text x="92" y="112" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#ff93c7">WE MARKETING · TIKTOK SHOP US</text>
  <text x="92" y="185" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Catalog change control</text>
  <text x="92" y="230" font-family="Arial,sans-serif" font-size="25" fill="#ded6e8">An eight-step release protects the buying experience.</text>
  <g filter="url(#shadow)"><rect x="110" y="340" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="142" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">01</text><text x="142" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Customer job</text><text x="142" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">What must the shopper do?</text></g><g filter="url(#shadow)"><rect x="470" y="340" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="502" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">02</text><text x="502" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Product map</text><text x="502" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Identity and variants</text></g><g filter="url(#shadow)"><rect x="830" y="340" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="862" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">03</text><text x="862" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Fulfillment</text><text x="862" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Stock and delivery</text></g><g filter="url(#shadow)"><rect x="1190" y="340" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="1222" y="388" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">04</text><text x="1222" y="448" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Creator links</text><text x="1222" y="494" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Content and tracking</text></g><g filter="url(#shadow)"><rect x="290" y="610" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="322" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">05</text><text x="322" y="718" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Test</text><text x="322" y="764" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">One controlled release</text></g><g filter="url(#shadow)"><rect x="650" y="610" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="682" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">06</text><text x="682" y="718" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Publish</text><text x="682" y="764" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Customer-facing proof</text></g><g filter="url(#shadow)"><rect x="1010" y="610" width="300" height="170" rx="28" fill="#211d31" stroke="#ff4fa3" stroke-opacity=".55"/><text x="1042" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#ff4fa3">07–08</text><text x="1042" y="718" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Read and repair</text><text x="1042" y="764" font-family="Arial,sans-serif" font-size="22" fill="#ded6e8">Measure, then adjust</text></g><text x="110" y="885" font-family="Arial,sans-serif" font-size="27" fill="#ded6e8">A catalog change is an operating release, not an isolated listing edit.</text>
</svg>
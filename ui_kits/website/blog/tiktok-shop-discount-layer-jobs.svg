</defs><rect width="1600" height="960" fill="url(#bg)"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#5c55a0">WE MARKETING · OPERATING FRAMEWORK</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="800" fill="#171521">Give every discount layer one job</text>
<text x="90" y="222" font-family="Arial,sans-serif" font-size="24" fill="#625c70">Do not pay twice for the same conversion job unless the combined offer is deliberate and profitable.</text><g filter="url(#shadow)"><rect x="75" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#3168e8" stroke-width="3"/><text x="103" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3168e8">BASE VALUE</text><text x="103" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Product Discount</text><text x="103" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Approved base offer</text></g><g filter="url(#shadow)"><rect x="380" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#5a69e3" stroke-width="3"/><text x="408" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5a69e3">URGENCY</text><text x="408" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Flash / LIVE</text><text x="408" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Time + stock limit</text></g><g filter="url(#shadow)"><rect x="685" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#8465df" stroke-width="3"/><text x="713" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#8465df">BEHAVIOR</text><text x="713" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Coupon</text><text x="713" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Earned condition</text></g><g filter="url(#shadow)"><rect x="990" y="315" width="270" height="235" rx="26" fill="#fff" stroke="#ad61d0" stroke-width="3"/><text x="1018" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ad61d0">BASKET</text><text x="1018" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Quantity / Ship</text><text x="1018" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Useful order value</text></g><g filter="url(#shadow)"><rect x="1295" y="315" width="230" height="235" rx="26" fill="#fff" stroke="#ed63a8" stroke-width="3"/><text x="1323" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ed63a8">ACCESS</text><text x="1323" y="409" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#171521">Campaign</text><text x="1323" y="452" font-family="Arial,sans-serif" font-size="20" fill="#625c70">Verified terms</text></g><rect x="75" y="655" width="1450" height="94" rx="22" fill="#171521"/><text x="115" y="714" font-family="Arial,sans-serif" font-size="27" fill="#fff">One customer price. One purpose per layer. One named owner.</text></svg>
              <strong>Languages:</strong> English (default). Spanish, Haitian Creole, Vietnamese, Korean, and others available upon request.
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function HowItWorks() {
  const steps = [
    ['01', 'Choose your package', 'Essentials for volume, Select for curation, Premium for storytelling.'],
    ['02', 'Submit your brief', 'Product, target audience, content direction. WEM handles creator matching.'],
    ['03', 'Creators produce content', 'Each creator films multiple videos. WEM manages sampling, briefing, and QA.'],
    ['04', 'Review and select (Select package)', '70+ videos delivered. Pick your best 50. Contact us for add-on pricing.'],
    ['05', 'Receive final deliverables', 'Edited videos + raw footage via Google Drive. Ready for ads.'],
  ];
  return (
    <section style={S.section}>
      <div style={S.inner}>
        <h2 style={S.h2}>How it <span style={S.grad}>works.</span></h2>
        <div style={{ marginTop: 32 }}>
          {steps.map(([n, t, b], i) => (
            <div key={i} style={S.step}>
              <div style={S.stepNum}>{n}</div>
              <div>
                <div style={S.stepTitle}>{t}</div>
                <div style={S.stepBody}>{b}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function FinalCta() {
  return (
    <section style={{ ...S.section, background: 'linear-gradient(135deg, #FF1493 0%, #9B30FF 100%)', textAlign: 'center', padding: '140px 32px' }}>
      <div style={S.inner}>
        <h2 style={{ ...S.h2, color: '#fff', margin: '0 auto 24px', maxWidth: 900 }}>Ready to get <span style={{ color: '#fff', textShadow: '0 0 32px rgba(255,255,255,.4)' }}>started?</span></h2>
        <p style={{ fontFamily: 'var(--font-sans)', fontSize: 20, lineHeight: 1.5, color: 'rgba(255,255,255,.9)', maxWidth: 720, margin: '0 auto 36px' }}>Tell us your product, target audience, and content goals. We handle creator matching, briefing, production, and delivery. Full service from brief to final cut.</p>
        <a href={BOOK} target="_blank" rel="noopener" style={{ background: '#fff', color: '#000', padding: '18px 36px', borderRadius: 999, fontFamily: 'var(--font-sans)', fontWeight: 800, fontSize: 16, letterSpacing: '.04em', textTransform: 'uppercase', textDecoration: 'none', display: 'inline-block' }}>Book a Call</a>
      </div>
    </section>
  );
}

function App() {
  const [lang, setLang] = useState(() => localStorage.getItem('we-lang') || 'en');
  useEffect(() => { localStorage.setItem('we-lang', lang); }, [lang]);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  return (
    <div data-screen-label="WE Services · Creator Content">
      <NavBar lang={lang} onLang={setLang} basePath="../" />
      <Hero/>
      <Stats/>
      <Pricing/>
      <Compare/>
      <SampleWork/>
      <CaseStudy/>
      <Rights/>
      <HowItWorks/>
      <FinalCta/>
      <Footer lang={lang} basePath="../" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>

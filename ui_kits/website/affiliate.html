<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WE Affiliate, Creator Community · WE Marketing</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); color: #fff; background:#000; }
  * { box-sizing: border-box; }
  :root {
    --accent-pink: #FF1493;
    --accent-purple: #9B30FF;
    --accent-cyan: #00E5FF;
    --accent-lime: #C6FF3D;
    --discord-blurple: #5865F2;
  }
  .perk-card:hover { transform: translateY(-4px); border-color: rgba(255,20,147,.4) !important; box-shadow: 0 0 0 1px rgba(255,20,147,.3), 0 0 60px rgba(255,20,147,.15); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="AffiliateHero.jsx"></script>
<script type="text/babel" src="AffiliateBenefits.jsx"></script>
<script type="text/babel" src="MeetYourCoach.jsx"></script>
<script type="text/babel" src="AffiliateCommunity.jsx"></script>
<script type="text/babel" src="AffiliateJoinCta.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [lang, setLang] = useState(() => localStorage.getItem('we-lang') || 'en');
    useEffect(() => { localStorage.setItem('we-lang', lang); }, [lang]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [lang]);
    return (
      <div data-screen-label="WE Affiliate">
        <NavBar lang={lang} onLang={setLang} />
        <AffiliateHero lang={lang} />
        <AffiliateBenefits lang={lang} />
        <MeetYourCoach lang={lang} />
        <AffiliateCommunity lang={lang} />
        <AffiliateJoinCta lang={lang} />
        <Footer lang={lang} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<body>
<div id="root"></div>
<script type="text/babel" src="NavBar.jsx"></script>

<script type="text/babel" src="CtaFooter.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [lang, setLang] = useState(() => localStorage.getItem('we-lang') || 'en');
    useEffect(() => { localStorage.setItem('we-lang', lang); }, [lang]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [lang]);
    return (
      <div data-screen-label="WE About">
        <NavBar lang={lang} onLang={setLang} />
        <AboutHero lang={lang} />
        <AboutCapability lang={lang} />
        <CtaFooter lang={lang} />
        <Footer lang={lang} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

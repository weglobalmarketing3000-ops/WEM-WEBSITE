<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Shop Services | Creator Seeding, Affiliate Management | WE Marketing</title>
<meta name="description" content="Full-service TikTok Shop management: creator seeding from 8,000+ creators, affiliate program setup, shop operations, and content amplification.">
<link rel="canonical" href="https://weglobalmarketing.com/showcase.html">
<meta property="og:image:alt" content="WE Marketing TikTok Shop case studies. 160+ brand partners. $15M+ annual sales. Beauty, wellness, tech, fashion.">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); color: #fff; background:#000; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="CursorStars.jsx"></script>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="WorkHero.jsx"></script>
<script type="text/babel" src="NumbersStrip.jsx"></script>
<script type="text/babel" src="FeaturedCase.jsx"></script>
<script type="text/babel" src="PrecisionMatch.jsx"></script>
<script type="text/babel" src="CtaFooter.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [lang, setLang] = useState(() => localStorage.getItem('we-lang') || 'en');
    useEffect(() => { localStorage.setItem('we-lang', lang); }, [lang]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [lang]);
    return (
      <div data-screen-label="WE Marketing Work">
        <CursorStars />
        <NavBar lang={lang} onLang={setLang} />
        <WorkHero lang={lang} />
        <NumbersStrip lang={lang} />
        <FeaturedCase lang={lang} />
        <PrecisionMatch lang={lang} />
        <CtaFooter lang={lang} />
        <Footer lang={lang} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

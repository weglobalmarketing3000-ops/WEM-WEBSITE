<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog | TikTok Shop Strategy & Playbooks · WE Marketing</title>
<meta name="description" content="TikTok Shop strategy, creator partnerships, affiliate playbooks, and brand launch guides from WE Marketing, a TikTok Shop Partner Agency. Updated 2026.">
<meta property="og:title" content="Blog | TikTok Shop Strategy & Playbooks · WE Marketing">
<meta property="og:description" content="TikTok Shop strategy, creator partnerships, affiliate playbooks, and brand launch guides from WE Marketing, a TikTok Shop Partner Agency. Updated 2026.">
<meta property="og:type" content="website">
<meta property="og:url" content="/blog.html">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; padding:0; font-family: var(--font-sans); color: #fff; background:#000; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="NavBar.jsx"></script>
<script type="text/babel" src="BlogIndexHero.jsx"></script>
<script type="text/babel" src="BlogList.jsx"></script>
<script type="text/babel" src="CtaFooter.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  function App() {
    const [lang, setLang] = useState(() => {
      const urlLang = new URLSearchParams(window.location.search).get('lang');
      if (urlLang === 'zh' || urlLang === 'en') return urlLang;
      return localStorage.getItem('we-lang') || 'en';
    });
    useEffect(() => {
      localStorage.setItem('we-lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.title = lang === 'zh'
        ? '博客 | TikTok Shop 策略与实战指南 · WE Marketing'
        : 'Blog | TikTok Shop Strategy & Playbooks · WE Marketing';
    }, [lang]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [lang]);
    return (
      <div data-screen-label="WE Blog">
        <NavBar lang={lang} onLang={setLang} />
        <BlogIndexHero lang={lang} />
        <BlogList lang={lang} />
        <CtaFooter lang={lang} />
        <Footer lang={lang} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WE Marketing — Business Deck</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="deck-stage.js"></script>
<style>
  html, body { margin:0; padding:0; background:#000; font-family: var(--font-sans); }
  deck-stage > section { background:#000; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section data-label="Cover"><div id="s01"></div></section>
  <section data-label="About Us"><div id="s02"></div></section>
  <section data-label="Highlights"><div id="s03"></div></section>
  <section data-label="Services"><div id="s04"></div></section>
  <section data-label="Why Brands Choose Us"><div id="s05"></div></section>
  <section data-label="Growth Approach"><div id="s06"></div></section>
  <section data-label="Cold Start"><div id="s07"></div></section>
  <section data-label="Showcase Electronics"><div id="s08"></div></section>
  <section data-label="Showcase Fashion"><div id="s09"></div></section>
  <section data-label="Creator Ecosystem"><div id="s10"></div></section>
  <section data-label="Creator Community"><div id="s11"></div></section>
  <section data-label="Content Engine"><div id="s12"></div></section>
  <section data-label="Live Engine"><div id="s13"></div></section>
  <section data-label="Showcase Health"><div id="s14"></div></section>
  <section data-label="Showcase Beauty"><div id="s15"></div></section>
  <section data-label="Creator Matchmaking"><div id="s16"></div></section>
  <section data-label="Closing"><div id="s17"></div></section>
</deck-stage>
<script type="text/babel" src="SlideShell.jsx"></script>
<script type="text/babel" src="SlidesA.jsx"></script>
<script type="text/babel" src="SlidesB.jsx"></script>
<script type="text/babel" src="SlidesC.jsx"></script>
<script type="text/babel">
  const mounts = [
    ['s01', <CoverSlide/>], ['s02', <AboutSlide/>], ['s03', <HighlightsSlide/>],
    ['s04', <ServicesSlide/>], ['s05', <WhyUsSlide/>], ['s06', <GrowthApproachSlide/>],
    ['s07', <ColdStartSlide/>], ['s08', <ShowcaseElectronicsSlide/>], ['s09', <ShowcaseFashionSlide/>],
    ['s10', <CreatorEcosystemSlide/>], ['s11', <CreatorCommunitySlide/>], ['s12', <ContentEngineSlide/>],
    ['s13', <LiveEngineSlide/>], ['s14', <ShowcaseHealthSlide/>], ['s15', <ShowcaseBeautySlide/>],
    ['s16', <CreatorMatchmakingSlide/>], ['s17', <ClosingSlide/>],
  ];
  mounts.forEach(([id, el]) => ReactDOM.createRoot(document.getElementById(id)).render(el));
</script>
</body>
</html>
